<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações | CineMorph AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#05070B] text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl space-y-6">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-black">CM</div>
      <div>
        <h1 class="font-bold text-white">Configurar API Key</h1>
        <p class="text-xs text-slate-400">Cole sua chave do Gemini para usar a clonagem</p>
      </div>
    </div>
    <div>
      <label class="text-xs font-semibold text-slate-400">Gemini API Key</label>
      <input id="apiKey" type="password" placeholder="AIza..." class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:border-indigo-500 outline-none">
      <p class="text-[11px] text-slate-500 mt-2">Sua chave fica salva apenas no seu navegador (localStorage).</p>
    </div>
    <div id="status" class="hidden text-xs p-2.5 rounded-lg"></div>
    <button onclick="saveKey()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/30">
      <i class="fa-solid fa-floppy-disk mr-2"></i>Salvar e Voltar
    </button>
    <a href="index.html" class="block text-center text-xs text-slate-500 hover:text-white">Voltar ao Studio</a>
  </div>
  <script>
    const input = document.getElementById('apiKey');
    const status = document.getElementById('status');
    input.value = localStorage.getItem('gemini_api_key') || '';
    if (input.value) { status.className = 'text-xs p-2.5 rounded-lg bg-emerald-950 border border-emerald-800 text-emerald-400'; status.innerText = 'Chave já configurada'; status.classList.remove('hidden'); }
    function saveKey() {
      const key = input.value.trim();
      if (!key) { alert('Cole sua API Key'); return; }
      localStorage.setItem('gemini_api_key', key);
      status.className = 'text-xs p-2.5 rounded-lg bg-emerald-950 border border-emerald-800 text-emerald-400';
      status.innerText = 'Salvo! Redirecionando...';
      status.classList.remove('hidden');
      setTimeout(() => location.href = 'index.html', 800);
    }
  </script>
</body>
</html>
