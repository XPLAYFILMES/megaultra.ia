<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4 font-sans" onclick="fecharMenusAbertos(event)">

  <!-- ================= TELA DE CADASTRO / LOGIN ================= -->
  <div id="authScreen" class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-16 h-16 rounded-2xl bg-blue-600/10 border border-blue-500/30 flex items-center justify-center text-blue-400 text-3xl mx-auto shadow-inner">
        🎬
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Universal Master Studio</h1>
      <p class="text-xs text-slate-400">
        Digite seu nome e senha para acessar ou criar sua conta na hora.
      </p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">
          Nome de Usuário
        </label>
        <input 
          type="text" 
          id="authUsername" 
          placeholder="Ex: alex" 
          class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">
          Sua Senha
        </label>
        <input 
          type="password" 
          id="authPassword" 
          placeholder="Digite sua senha" 
          onkeydown="if(event.key==='Enter') executarAcesso()"
          class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition"
        />
      </div>

      <div id="loginFeedback" class="text-xs py-2.5 px-3 rounded-lg hidden font-medium"></div>

      <button

        Entrar / Cadastrar Conta
      </button>
    </div>
  </div>

  <!-- ================= PAINEL DO STUDIO ================= -->
  <div id="appScreen" class="w-full max-w-6xl h-screen sm:h-[92vh] bg-slate-900 border border-slate-800 sm:rounded-2xl shadow-2xl flex overflow-hidden hidden">
    
    <!-- BARRA LATERAL -->
    <aside class="w-64 sm:w-80 bg-slate-950 border-r border-slate-800 flex flex-col justify-between select-none">
      <div class="p-4 space-y-4 flex-1 flex flex-col min-h-0">

        </button>

        <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider px-1 shrink-0">

      </div>

      <!-- Rodapé do Usuário -->
      <div class="p-3 border-t border-slate-800 flex items-center justify-between bg-slate-950/60 shrink-0">
        <div class="flex items-center gap-2.5 overflow-hidden">
          <div class="w-8 h-8 rounded-full bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400 font-bold text-xs">

          </div>
          <div class="flex flex-col truncate">

        <div class="flex items-center gap-2 truncate">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shrink-0"></div>

            placeholder="Digite [1], [0], [Mais 20] ou sua resposta..." 
            onkeydown="if(event.key==='Enter') enviarMensagemUsuario()"
            class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition"
          />
          <button onclick="enviarMensagemUsuario()" id="sendBtn" class="px-5 py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl text-sm transition disabled:opacity-40">

  <!-- ================= LÓGICA DO STUDIO ================= -->
  <script>
    const SYSTEM_PROMPT = `[CONFIGURAÇÃO_DE_SISTEMA]
NOME: Universal Master Studio Engine
VERSÃO: 5.5 Ultra-Modular (Cross-Platform Ready: ChatGPT, Copilot, Gemini, Meta AI)
PAPEL: Diretor Geral de Produção Audiovisual, Engenheiro Chefe de Prompts e Arquiteto de Negócios Digitais.

[DIRETRIZES_DE_EXECUÇÃO_OBRIGATÓRIAS - LEIA COM ATENÇÃO]
1. EXECUÇÃO MONOTAREFA ESTRITA: Você opera como uma máquina de estados sequencial. Apresente EXCLUSIVAMENTE a ETAPA ATUAL e PARE IMEDIATAMENTE. É expressamente proibido exibir duas etapas na mesma resposta ou adiantar conteúdos.
2. TRAVA DE VALIDAÇÃO OBRIGATÓRIA (STRICT GATEKEEPING): O avanço para a etapa seguinte é ESTRITAMENTE CONDICIONADO a uma resposta válida do usuário. Se o usuário tentar pular, enviar mensagem vaga, mudar de assunto sem responder ou deixar a pergunta em aberto, NÃO AVANCE sob hipótese alguma. Emita a mensagem padrão: "⚠️ Esta etapa é obrigatória para garantir a consistência do projeto. Por favor, escolha uma das opções acima, digite sua resposta personalizada ou envie [0] para seleção automática." e reapresente a pergunta ativa.
3. PADRONIZAÇÃO DE PERGUNTAS: Nunca altere a estrutura, a ordem ou a linguagem das perguntas básicas. Mantenha o formato fixo para garantir consistência.
4. ISOLAMENTO TOTAL DE NICHOS: Nunca misture assuntos, regras ou terminologias de um nicho em outro. Cada fluxo opera de forma independente e isolada.
5. PADRÃO NUMÉRICO SERIAL: Todas as cenas de imagem e vídeo devem conter obrigatoriamente o prefixo exato "Scene 01:", "Scene 02:", "Scene 03:" até a última cena, sem exceções.
6. COMANDO UNIVERSAL [0] (MODO AUTOMÁTICO): Se o usuário digitar "[0]", "não sei" ou "automático", selecione a melhor opção estratégica de alto engajamento, justifique em 1 linha e avance para a próxima etapa.
7. COMANDO UNIVERSAL [MAIS 20]: Se o usuário digitar "Mais 20", gere imediatamente 20 opções inéditas daquela etapa e mantenha a etapa aberta.
8. COMANDO UNIVERSAL [NOVO]: Se o usuário desejar personalizar, ele pode descrever livremente e você adaptará aos padrões técnicos.

---

[INÍCIO DO FLUXO - MENU PRINCIPAL]

APRESENTE IMEDIATAMENTE AO INICIAR A SEGUINTE ETAPA 1 E AGUARDE A RESPOSTA:

### ETAPA 1: ESCOLHA DO MODO DE OPERAÇÃO
Selecione o que deseja produzir hoje:

- [1] **Produção Audiovisual Completa (Canais Dark / YouTube / Shorts / TikTok)** -> *(Inicia o Mapeamento de Vídeo)*
- [2] **Fábrica de Novos Prompts (Criador de Mega-Prompts Especializados)** -> *(Gera um mega-prompt completo e profissional pronto para outros nichos, como Livros/E-books KDP, Carrosséis, Jogos, etc.)*

*(Resposta obrigatória: Escolha [1] ou [2] para avançar)*

---

[SE O USUÁRIO ESCOLHER A OPÇÃO 2: FÁBRICA DE NOVOS PROMPTS]
Pergunte o tema do novo Mega-Prompt desejado:
- [A] Livros Digitais, E-books & Amazon KDP (Estrutura de capítulos, criação literária, prompts de capa, ilustrações internas e diagramação)
- [B] Infoprodutos, Cursos & Páginas de Vendas (Roteiros de VSL, copy de alta conversão, e-mails e criativos)
- [C] Carrosséis & Posts Magnéticos para Instagram / LinkedIn
- [D] Game Design, Criação de Jogos & Roteiros de RPG
- [E] Outro Nicho Personalizado (O usuário digita o tema desejado)

*(Trava Ativa: Aguarde a resposta obrigatória do usuário antes de gerar o novo Mega-Prompt).*

*Ação da Fábrica:* O sistema gerará um Super Mega-Prompt estruturado, com a mesma qualidade cirúrgica, regras monotarefa, etapas guiadas e padrões técnicos profissionais pronto para copiar, colar e usar. Ao finalizar, pergunte se deseja iniciar o uso do novo prompt ou voltar ao menu principal.

---

[SE O USUÁRIO ESCOLHER A OPÇÃO 1: PRODUÇÃO AUDIOVISUAL COMPLETA]

#### ETAPA 1.1: SELEÇÃO DO MACRO-NICHO DE CONTEÚDO
- [0] **Automático / Direção Criativa:** A IA escolhe a opção mais lucrativa do momento.
- [1] **Culinária, Confeitaria & Gastronomia Tátil (ASMR Cozy):** Focado puramente na receita, texturas táteis, foley culinário e sons relaxantes. *(Ativa Fluxo Culinário Puro - sem mensagens morais ou religiosas).*
- [2] **Histórias Bíblicas, Parábolas & Fé:** Focado em passagens sagradas, reflexão, passagens históricas e mensagem bíblica de inspiração. *(Ativa Fluxo Bíblico).*
- [3] **Fábulas, Contos Infantis & Histórias com Moral:** Focado em público infantil/familiar, lição de vida, desenvolvimento de caráter e fábulas lúdicas. *(Ativa Fluxo Fábulas).*
- [4] **Curiosidades, Fatos Misteriosos & Documentários:** Mini documentários investigativos, história antiga, ciência e exploração. *(Ativa Fluxo Documental).*
- [5] **Terror, Lendas Urbanas & Suspense Psicológico:** Histórias de mistério, atmosfera densa e suspense imersivo. *(Ativa Fluxo Suspense).*
- [6] **Ficção Científica & Universos Futuristas:** Espaço, distopias, robôs e inteligência artificial. *(Ativa Fluxo Sci-Fi).*
- [7] **Desenvolvimento Pessoal & Estoicismo:** Filosofia prática, foco, disciplina e mentalidade. *(Ativa Fluxo Reflexivo).*
- [8] **Gaming, Fantasia Medieval & RPG:** Aventuras épicas, mundos em blocos (estilo Minecraft/Voxel) ou tavernas medievais. *(Ativa Fluxo Gamer/Fantasia).*
- [9] **Outro Nicho Personalizado:** Digite seu próprio nicho.

*(Trava Ativa: Resposta obrigatória para liberar a Etapa 1.2).*

---

#### ETAPA 1.2: MATRIZ DE ESTILO VISUAL & MOTOR DE RENDER
- [0] **Automático:** A IA seleciona o estilo que melhor se harmoniza com o nicho escolhido.
- [1] **3D Felt Craft / Stop-Motion Artesanal (Padrão Original do Vídeo):** Feltro agulhado tátil, penugem e microfibras de lã pura visíveis, olhos pretos esféricos de resina vitrificada com catchlight de estúdio, taxa de quadros pausada em 12fps (stepped motion), iluminação macro tilt-shift acolhedora.
- [2] **3D Estilizado Pixar / Disney (CGI Suave):** Modelagem 3D premium, superfícies aveludadas, iluminação volumétrica mágica, render estilo Octane / Unreal Engine 5.
- [3] **Live Action Hiper-Realista (Cinematografia Real 8K):** Lente macro 35mm/50mm, textura biológica autêntica, profundidade de campo rasa real, iluminação natural de estúdio.
- [4] **3D Claymation (Massinha de Modelar):** Textura tátil de argila/plasticina com leves marcas manuais artesanais, iluminação de estúdio miniatura clássico.
- [5] **3D Voxel / Pixel Art Diorama:** Mundos isométricos construídos em micro-blocos tridimensionais com iluminação ray-tracing realista.
- [6] **3D Papercraft & Origami Art:** Camadas tridimensionais de papel artesanal, dobras geométricas finas e sombras suaves.
- [7] **Anime / Desenho 2.5D Cinematográfico:** Ilustração estilizada de alto padrão (estilo Studio Ghibli), aquarela digital com iluminação solar dramática.
- [8] **Outro Estilo Visual:** Descreva a estética desejada.

*(Trava Ativa: Resposta obrigatória para liberar a Etapa 1.3).*

---

#### ETAPA 1.3: HISTÓRIA, TEMA ESPECÍFICO & MENSAGEM
Apresente a opção [0] Automático + 20 sugestões de temas/receitas/histórias estritamente alinhadas ao nicho escolhido.
Perguntas fixas da etapa:
1. Qual o tema ou receita escolhido?
2. Qual a mensagem central, versículo ou moral do vídeo? *(Se o nicho for culinária, essa pergunta é automaticamente dispensada).*
3. Deseja a geração de 20 Títulos Virais de Alto CTR para o YouTube? (Sim / Não / Automático).

*(Trava Ativa: Resposta obrigatória para liberar a Etapa 1.4).*

---

#### ETAPA 1.4: CASTING DE PERSONAGENS & TRAVA DE CONSISTÊNCIA (ID LOCK)
1. Pergunte quantos personagens estarão presentes:
   - [0] Automático
   - [A] 1 Personagem Solo
   - [B] 2 Personagens Interagindo (cooperando e conversando)
   - [C] 3 ou mais Personagens (grupo / família)
   - [D] Sem Personagens (foco em objetos/ambientes/culinária em primeira pessoa)
2. Apresente [0] Automático + 20 opções de personagens desenhados no estilo visual selecionado.
3. *Regra de Engenharia:* A IA criará uma ficha anatômica com Character_ID Lock imutável para travar espécies, roupas, olhos e materiais em 100% dos prompts.

*(Trava Ativa: Resposta obrigatória para liberar a Etapa 1.5).*

---

#### ETAPA 1.5: CENÁRIOS, ATMOSFERA & PALETA DE CORES
1. Apresente [0] Automático + 20 opções de cenários ricos em iluminação e detalhes.
2. Defina o clima/iluminação:
   - [0] Automático
   - [1] Luz dourada matinal acolhedora (Golden Hour 2700K)
   - [2] Tarde chuvosa aconchegante com reflexos em janelas
   - [3] Crepúsculo / Pôr do sol cinematográfico
   - [4] Noite enluarada com luz de fogueira/velas
   - [5] Iluminação volumétrica de estúdio macro
3. *Paleta HEX:* A IA gerará 4 códigos hexadecimais para color grading unificado.

*(Trava Ativa: Resposta obrigatória para liberar a Etapa 1.6).*

---

#### ETAPA 1.6: NARRATIVA, IDIOMA & CONFIGURAÇÃO VOCAL IA
1. Presença de Voz:
   - [0] Automático
   - [1] Com Narração e Diálogos Curtos
   - [2] Somente Narração em off
   - [3] Sem Voz (Vídeo puramente ASMR, instrumental e foley de alta fidelidade)
2. Idioma: Português, Inglês, Espanhol ou outro solicitado (Padrão: Português).
3. Perfil da Voz IA (ElevenLabs): Feminina Acolhedora, Masculina Sábia/Cinematográfica, Jovem ou Sussurro ASMR.
*Regra de Diálogos:* Falas entre personagens devem ter no máximo 1 a 2 linhas curtas por cena.

*(Trava Ativa: Resposta obrigatória para liberar a Etapa 1.7).*

---

#### ETAPA 1.7: ESCALA DE PRODUÇÃO, PROPORÇÃO & PLATAFORMA
1. Volume de Cenas:
   - [0] Automático
   - 10 cenas (Shorts / Reels / TikTok)
   - 15 a 20 cenas (Vídeo padrão de 2 a 4 minutos no YouTube)
   - 30 cenas (Vídeo longo de retenção intermediária)
   - 50 cenas (Narrativa completa imersiva)
   - 75 a 100 cenas (Compilação Long-Form definitiva para máxima monetização)
   - Personalizado (Digite qualquer quantidade exata)
2. Proporção de Tela (Aspect Ratio):
   - [0] Automático
   - 16:9 (Horizontal para YouTube tradicional) + Sugestão de cortes 9:16 para Shorts
   - 9:16 (Vertical exclusivo para Shorts, TikTok e Reels)
   - 1:1 ou 4:5 (Quadrado / Feed)

*(Trava Ativa: Resposta obrigatória para liberar o Dossiê Final de Produção).*

---

[FORMATO DE ENTREGA FINAL COMPLETA - DOSSIÊ DE PRODUÇÃO STUDIO GRADE]

Após a confirmação da Etapa 1.7, entregue o plano final estruturado rigorosamente nesta ordem:

1. **[FICHA TÉCNICA, PALETA HEX & CHARACTER ID LOCK]:**
   - Metatags de consistência dos personagens e do cenário para colar como referência fixa em todas as ferramentas.

2. **[PROMPTS MESTRES DE REFERÊNCIA & MODEL SHEET 360°] (Em Inglês):**
   - **Prompt Mestre dos Personagens:** Visão de corpo inteiro isolada em fundo neutro de estúdio com macro-texturas detalhadas.
   - **Prompt Turnaround Sheet (4 Ângulos):** Frente, perfil, 3/4 e costas para modelos de animação de vídeo.
   - **Prompt Mestre do Cenário:** Vista ambiental ampla com iluminação volumétrica e arquitetura.
   - **Prompt do Selo Redondo Anti-Marca D'Água:** Ícone PNG circular do rosto do personagem com fundo transparente para cobrir logotipos no CapCut.

3. **[PACOTE DE CAPA VIRAL (THUMBNAIL) & CTR MÁXIMO]:**
   - Prompt cinematográfico em inglês para a imagem de capa (primeiro plano expressivo, iluminação contrastada e espaço para texto).
   - 3 sugestões de texto magnético para a capa (máximo 4 palavras).

4. **[DIRETRIZ DE VOZ IA (ELEVENLABS) & ROTEIRO MESTRE]:**
   - Parâmetros exatos de Voice Design (Stability, Similarity, Style Exaggeration).
   - Texto corrido completo da locução (se aplicável), com marcações de pausas e entonação.

5. **[PROMPTS DE ÁUDIO IA (SUNO / UDIO & ELEVENLABS SFX)]:**
   - **Prompt de Trilha Sonora:** Estilo, instrumentos acústicos, tom, BPM e ausência de vocais indesejados.
   - **Prompt de Efeitos Sonoros (SFX):** Comandos em inglês para gerar o foley tátil na ElevenLabs.

6. **[COMANDO MESTRE DE GERAÇÃO EM LOTE (BATCH PROMPT PARA IMAGENS)]:**
   - Comando pronto para copiar e colar no Google Flow / Midjourney / Agentes de IA:
   > "Gere todas as imagens a seguir mantendo estritamente a consistência visual dos personagens (Character_ID) e do cenário mestre incluídos no comando. Preserve rigorosamente no início de cada imagem os prefixos 'Scene 01:', 'Scene 02:', 'Scene 03:' para identificação e ordenação correta dos downloads."

7. **[CRONOGRAMA DE PRODUÇÃO DE CENAS E MOVIMENTOS]:**
   *A Cena 01 contém obrigatoriamente um Visual Hook nos primeiros 3 segundos.*
   *A cada 5 cenas, uma quebra de padrão visual (Pattern Interrupt).*
   *A Cena Central contém o pico de retenção.*
   *A Cena Final é desenhada para um Seamless Loop contínuo.*

   Estruturado numericamente:
   - **Scene [XX] - Visual (Imagem):** `Scene [XX]: [Prompt cinematográfico em inglês para gerador de imagens, especificando enquadramento com lentes reais de cinema, micro-expressão, iluminação em Kelvin, interação com objetos, proporção (--ar) e parâmetros negativos (--no)]`
   - **Scene [XX] - Motion (Vídeo):** `Scene [XX] Motion: [Prompt em inglês direto para gerador de vídeo (Pavo AI, Agnes, Kling, Runway, Luma), com comandos de câmera (slow push-in, pan, tilt, rack focus) e física de movimento calibrada ao estilo visual]`
   - **Scene [XX] - Diálogos / Narração:** Falas curtas de cada personagem e trecho da locução correspondente.
   - **Scene [XX] - Sound Design (ASMR Foley & Trilha):** Descrição do efeito sonoro real e níveis sugeridos de volume.

8. **[TABELA BATCH EXPORT (INDEXADA POR CENA)]:**
   - Tabela Markdown compacta:
   | Cena # | Arquivo Salvo | Prompt de Imagem Resumido | Prompt de Vídeo | Foley & Áudio |
   | :--- | :--- | :--- | :--- | :--- |

9. **[BLOCO DE EXPORTAÇÃO JSON UNIVERSAL (AUTOMATION READY)]:**
   - Todo o cronograma estruturado em um único bloco de código JSON limpo para importação direta em planilhas ou scripts de automação.

10. **[PACOTE DE SEO & ESTRATÉGIA DE MONETIZAÇÃO]:**
    - Descrição otimizada do vídeo com gancho nas primeiras linhas e timestamps organizados.
    - Bloco de 15 tags de alto volume e 5 hashtags estratégicas.
    - Ponto exato de inserção de CTA para inscrição ou indicação de produtos/afiliados.
    - Pergunta estratégica para Comentário Fixado.

11. **[GUIA RÁPIDO DE EDIÇÃO (CAPCUT / PREMIERE)]:**
    - Instruções para importação direta dos arquivos renomeados (`cena_01`, `cena_02`), balanço de volume (Voz: -3dB, Foley: -14dB, Trilha: -22dB) e aplicação da máscara anti-marca d'água.

    let memoryUsers = {};
    let memoryProjects = {};
    let memoryKey = "";

    function getStorageUsers() {
      try {
        const u = localStorage.getItem("studio_final_users");
        return u ? JSON.parse(u) : memoryUsers;
      } catch (e) { return memoryUsers; }
    }

    function saveStorageUsers(users) {
      memoryUsers = users;
      try { localStorage.setItem("studio_final_users", JSON.stringify(users)); } catch (e) {}
    }

    function getStorageProjects(user) {
      const key = "studio_proj_" + user.toLowerCase();
      try {
        const p = localStorage.getItem(key);
        return p ? JSON.parse(p) : (memoryProjects[key] || []);
      } catch (e) { return memoryProjects[key] || []; }
    }

    function saveStorageProjects(user, projs) {
      const key = "studio_proj_" + user.toLowerCase();
      memoryProjects[key] = projs;
      try { localStorage.setItem(key, JSON.stringify(projs)); } catch (e) {}
    }

    let activeUser = null;
    let currentConversationId = null;
    let conversationHistory = [];

    function obterChave() {
      const input = document.getElementById("geminiKeyInput");
      const valInput = input ? input.value.trim() : "";
      if (valInput) return valInput;

      try {
        const stored = localStorage.getItem("GEMINI_KEY_ACTIVE");
        if (stored) return stored.trim();
      } catch (e) {}

      return memoryKey.trim();
    }

    function autoSalvarChave() {
      const input = document.getElementById("geminiKeyInput");
      const key = input.value.trim();
      memoryKey = key;
      try {
        localStorage.setItem("GEMINI_KEY_ACTIVE", key);
      } catch (e) {}
    }

    function salvarChaveGemini(mostrarAviso = true) {
      const input = document.getElementById("geminiKeyInput");
      const key = input.value.trim();

      if (!key) {
        alert("Cole sua chave de API antes de salvar.");
        input.focus();
        return;
      }

      memoryKey = key;
      try {
        localStorage.setItem("GEMINI_KEY_ACTIVE", key);
      } catch (e) {}

      const btn = document.getElementById("saveKeyBtn");
      btn.textContent = "Salvo ✓";
      btn.className = "bg-emerald-600 text-white font-medium px-3 py-1.5 rounded-lg text-xs transition shadow-sm";
      setTimeout(() => {
        btn.textContent = "Salvar";
        btn.className = "bg-blue-600 hover:bg-blue-500 text-white font-medium px-3 py-1.5 rounded-lg text-xs transition shadow-sm";
      }, 1500);

      if (mostrarAviso) {
        alert("Chave Gemini salva com sucesso!");
      }
    }

    function carregarChaveSalva() {
      try {
        const saved = localStorage.getItem("GEMINI_KEY_ACTIVE");
        if (saved) {
          memoryKey = saved;
          const input = document.getElementById("geminiKeyInput");
          if (input) input.value = saved;
        }
      } catch (e) {}
    }

    // ==========================================
    // AUTENTICAÇÃO
    // ==========================================
    function executarAcesso() {
      const userInput = document.getElementById("authUsername");
      const passInput = document.getElementById("authPassword");
      const feedback = document.getElementById("loginFeedback");

      const username = (userInput.value || "").trim();
      const password = (passInput.value || "").trim();

      if (!username || !password) {
        feedback.textContent = "Preencha o nome de usuário e a senha!";
        feedback.className = "text-xs py-2.5 px-3 rounded-lg font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30";
        feedback.classList.remove("hidden");
        return;
      }

      const users = getStorageUsers();
      const userKey = username.toLowerCase();

      if (users[userKey]) {
        if (users[userKey].password === password) {
          feedback.textContent = `Bem-vindo de volta, ${users[userKey].name}! Entrando...`;
          feedback.className = "text-xs py-2.5 px-3 rounded-lg font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
          feedback.classList.remove("hidden");
          setTimeout(() => abrirStudio(users[userKey].name), 300);
        } else {
          feedback.textContent = "⚠️ Senha incorreta para este usuário!";
          feedback.className = "text-xs py-2.5 px-3 rounded-lg font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30";
          feedback.classList.remove("hidden");
        }
      } else {
        users[userKey] = { name: username, password: password };
        saveStorageUsers(users);

        feedback.textContent = `✨ Conta criada com sucesso! Bem-vindo, ${username}!`;
        feedback.className = "text-xs py-2.5 px-3 rounded-lg font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        feedback.classList.remove("hidden");
        setTimeout(() => abrirStudio(username), 400);
      }
    }

    function abrirStudio(username) {
      activeUser = username;
      try { localStorage.setItem("studio_active_session", username); } catch(e){}

      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("appScreen").classList.remove("hidden");
      document.getElementById("userNameDisplay").textContent = username;

      carregarChaveSalva();
      atualizarListaProjetos();

      const projs = getStorageProjects(activeUser);
      if (projs.length > 0) {
        selecionarProjeto(projs[0].id);
      } else {
        criarNovoProjeto();
      }
    }

    function fazerLogout() {
      try { localStorage.removeItem("studio_active_session"); } catch(e){}
      activeUser = null;
      window.location.reload();
    }

    // ==========================================
    // MENU DE 3 PONTINHOS
    // ==========================================
    function fecharMenusAbertos(e) {
      if (!e.target.closest(".menu-btn") && !e.target.closest(".menu-dropdown")) {
        document.querySelectorAll(".menu-dropdown").forEach(m => m.classList.add("hidden"));
      }
    }

    function toggleMenu(e, id) {
      e.stopPropagation();
      const menu = document.getElementById("dropdown_" + id);
      const estaAberto = !menu.classList.contains("hidden");
      document.querySelectorAll(".menu-dropdown").forEach(m => m.classList.add("hidden"));
      if (!estaAberto) {
        menu.classList.remove("hidden");
      }
    }

    function alternarFixarProjeto(e, id) {
      e.stopPropagation();
      const projs = getStorageProjects(activeUser);
      const proj = projs.find(p => p.id === id);
      if (proj) {
        proj.pinned = !proj.pinned;
        saveStorageProjects(activeUser, projs);
        atualizarListaProjetos();
      }
    }

    function renomearProjeto(e, id) {
      e.stopPropagation();
      const projs = getStorageProjects(activeUser);
      const proj = projs.find(p => p.id === id);
      if (!proj) return;

      const novoNome = prompt("Digite o novo nome para esta produção:", proj.title);
      if (novoNome && novoNome.trim()) {
        proj.title = novoNome.trim();
        saveStorageProjects(activeUser, projs);
        if (currentConversationId === id) {
          document.getElementById("currentChatTitle").textContent = proj.title;
        }
        atualizarListaProjetos();
      }
    }

    function excluirProjeto(e, id) {
      e.stopPropagation();
      const projs = getStorageProjects(activeUser);
      const proj = projs.find(p => p.id === id);
      if (!proj) return;

      if (confirm(`Tem certeza que deseja excluir a produção "${proj.title}"?`)) {
        const filtrados = projs.filter(p => p.id !== id);
        saveStorageProjects(activeUser, filtrados);
        if (currentConversationId === id) {
          if (filtrados.length > 0) {
            selecionarProjeto(filtrados[0].id);
          } else {
            criarNovoProjeto();
          }
        } else {
          atualizarListaProjetos();
        }
      }
    }

    function atualizarListaProjetos() {
      if (!activeUser) return;
      const projs = getStorageProjects(activeUser);
      
      projs.sort((a, b) => {
        if (a.pinned === b.pinned) return 0;
        return a.pinned ? -1 : 1;
      });

      const listEl = document.getElementById("conversationsList");
      listEl.innerHTML = "";

      projs.forEach(p => {
        const wrapper = document.createElement("div");
        wrapper.className = `relative group flex items-center justify-between px-3 py-2 rounded-xl text-xs transition cursor-pointer ${
          p.id === currentConversationId
            ? "bg-slate-800 text-blue-400 font-semibold"
            : "text-slate-400 hover:bg-slate-900/80 hover:text-slate-200"
        } ${p.pinned ? "border-l-2 border-amber-400 bg-slate-900/40" : ""}`;

        wrapper.onclick = () => selecionarProjeto(p.id);

        wrapper.innerHTML = `
          <div class="flex items-center gap-2 truncate pr-2">
            ${p.pinned ? '<span class="text-amber-400 text-[10px]" title="Fixado">📌</span>' : ''}
            <span class="truncate">${p.title || "Nova Produção"}</span>
          </div>

          <button 
            type="button" 
            onclick="toggleMenu(event, '${p.id}')"
            class="menu-btn p-1 rounded-md text-slate-400 hover:text-white hover:bg-slate-700/60 transition opacity-80 group-hover:opacity-100">
            ⋮
          </button>

          <div id="dropdown_${p.id}" class="menu-dropdown absolute right-2 top-8 w-36 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl py-1 z-30 hidden">
            <button onclick="alternarFixarProjeto(event, '${p.id}')" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 text-slate-300 hover:text-amber-300 flex items-center gap-2 text-xs">
              <span>📌</span> ${p.pinned ? "Desafixar" : "Fixar no topo"}
            </button>
            <button onclick="renomearProjeto(event, '${p.id}')" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 text-slate-300 hover:text-blue-300 flex items-center gap-2 text-xs">
              <span>✏️</span> Renomear
            </button>
            <button onclick="excluirProjeto(event, '${p.id}')" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 text-rose-400 hover:text-rose-300 flex items-center gap-2 text-xs border-t border-slate-800">
              <span>🗑️</span> Excluir
            </button>
          </div>
        `;

        listEl.appendChild(wrapper);
      });
    }

    function criarNovoProjeto() {
      if (!activeUser) return;
      const projs = getStorageProjects(activeUser);
      const novo = {
        id: "proj_" + Date.now(),
        title: "Nova Produção",
        pinned: false,
        messages: []
      };
      projs.unshift(novo);
      saveStorageProjects(activeUser, projs);
      atualizarListaProjetos();
      selecionarProjeto(novo.id);
    }

    function selecionarProjeto(id) {
      if (!activeUser) return;
      currentConversationId = id;
      const projs = getStorageProjects(activeUser);
      const proj = projs.find(p => p.id === id);
      if (!proj) return;

      document.getElementById("currentChatTitle").textContent = proj.title;
      const chatArea = document.getElementById("chatArea");
      const startScreen = document.getElementById("startScreen");
      chatArea.innerHTML = "";
      conversationHistory = [];

      if (!proj.messages || proj.messages.length === 0) {
        chatArea.appendChild(startScreen);
        startScreen.classList.remove("hidden");
      } else {
        startScreen.classList.add("hidden");
        proj.messages.forEach(m => {
          conversationHistory.push({ role: m.role, parts: [{ text: m.content }] });
          renderizarMensagem(m.content, m.role === "user");
        });
      }
      atualizarListaProjetos();
    }

    function renderizarMensagem(texto, isUser) {
      const chatArea = document.getElementById("chatArea");
      const div = document.createElement("div");
      div.className = `flex ${isUser ? "justify-end" : "justify-start"} w-full`;
      const bubble = document.createElement("div");
      bubble.className = `max-w-[85%] rounded-2xl p-4 text-sm ${
        isUser
          ? "bg-blue-600 text-white font-medium"
          : "bg-slate-800 border border-slate-700 text-slate-100 prose prose-invert"
      }`;
      bubble.innerHTML = isUser ? texto : (window.marked ? marked.parse(texto) : texto);
      div.appendChild(bubble);
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // ==========================================
    // CHAMADA MULTI-MODELO COM FALLBACK AUTOMÁTICO
    // ==========================================
    async function dispararGemini(texto, isInicial = false) {
      const apiKey = obterChave();

      if (!apiKey) {
        alert("Por favor, cole sua Gemini API Key no campo superior e clique em Salvar.");
        const inp = document.getElementById("geminiKeyInput");
        if (inp) inp.focus();
        return;
      }

      document.getElementById("startScreen").classList.add("hidden");

      const projs = getStorageProjects(activeUser);
      const atual = projs.find(p => p.id === currentConversationId);

      if (!isInicial) {
        renderizarMensagem(texto, true);
        conversationHistory.push({ role: "user", parts: [{ text: texto }] });
        if (atual) {
          atual.messages.push({ role: "user", content: texto });
          saveStorageProjects(activeUser, projs);
        }
      } else {
        conversationHistory.push({
          role: "user",
          parts: [{ text: "Iniciar motor de produção. Apresente a ETAPA 1 do menu principal." }]
        });
      }

      const sendBtn = document.getElementById("sendBtn");
      const userInput = document.getElementById("userInput");
      sendBtn.disabled = true;
      userInput.disabled = true;

      const indicador = document.createElement("div");
      indicador.id = "indicadorCarregando";
      indicador.className = "flex justify-start w-full";
      indicador.innerHTML = `
        <div class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-400 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-blue-500 animate-ping"></span>
          Diretor de Produção formulando etapa...
        </div>
      `;
      chatArea.appendChild(indicador);
      chatArea.scrollTop = chatArea.scrollHeight;

      // Lista ordenada de modelos para contornar sobrecarga
      const modelosCandidatos = [
        "gemini-2.0-flash",
        "gemini-2.0-flash-lite",
        "gemini-3.8-flash"
      ];

      let respostaFinal = null;
      let ultimoErro = null;

      for (const modelo of modelosCandidatos) {
        try {
          const resp = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                contents: conversationHistory,
                generationConfig: { maxOutputTokens: 8192 }
              })
            }
          );

          const data = await resp.json();

          if (data.error) {
            ultimoErro = data.error.message || `Código ${data.error.code}`;
            // Se for erro de demanda/limite, passa imediatamente ao próximo modelo
            continue;
          }

          if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
            respostaFinal = data.candidates[0].content.parts[0].text;
            break; // Sucesso, sai do loop
          }
        } catch (err) {
          ultimoErro = err.message;
        }
      }

      const loadEl = document.getElementById("indicadorCarregando");
      if (loadEl) loadEl.remove();

      if (respostaFinal) {
        conversationHistory.push({ role: "model", parts: [{ text: respostaFinal }] });
        renderizarMensagem(respostaFinal, false);

        if (atual) {
          atual.messages.push({ role: "model", content: respostaFinal });
          if (atual.messages.length <= 4 && !isInicial) {
            atual.title = texto.length > 25 ? texto.substring(0, 25) + "..." : texto;
            document.getElementById("currentChatTitle").textContent = atual.title;
          }
          saveStorageProjects(activeUser, projs);
          atualizarListaProjetos();
        }
      } else {
        renderizarMensagem(`❌ **Falha ao processar:** ${ultimoErro || "Servidores do Google ocupados no momento. Tente novamente em alguns segundos."}`, false);
      }

      sendBtn.disabled = false;
      userInput.disabled = false;
      userInput.focus();
    }

    function iniciarProducao() {
      dispararGemini("", true);
    }

    function enviarMensagemUsuario() {
      const input = document.getElementById("userInput");
      const val = input.value.trim();
      if (!val) return;
      input.value = "";
      dispararGemini(val, false);
    }

    window.onload = function() {
      try {
        const sessao = localStorage.getItem("studio_active_session");
        if (sessao) abrirStudio(sessao);
      } catch (e) {}
    };
  </script>
