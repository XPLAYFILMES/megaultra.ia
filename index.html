<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Master Studio AI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Script Oficial de Login do Google -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4">

  <!-- TELA DE LOGIN -->
  <div id="authScreen" class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl text-center space-y-6">
    <div class="w-16 h-16 rounded-2xl bg-blue-600/10 border border-blue-500/30 flex items-center justify-center text-blue-400 text-3xl mx-auto">
      🎬
    </div>
    <div>
      <h1 class="text-2xl font-bold text-white">Universal Master Studio</h1>
      <p class="text-sm text-slate-400 mt-1">Acesse para iniciar e salvar suas produções audiovisuais.</p>
    </div>

    <div class="space-y-3">
      <!-- Botão do Google Identity Services -->
      <div id="g_id_onload"
           data-client_id="COLE_AQUI_SEU_CLIENT_ID_SE_TIVER"
           data-callback="handleGoogleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin flex justify-center" data-type="standard" data-shape="pill" data-theme="filled_blue" data-text="signin_with" data-size="large"></div>

      <!-- Botão Acesso Rápido / Convidado (sem burocracia) -->
      <button id="guestLoginBtn" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl flex items-center justify-center gap-2 transition border border-slate-700">
        <span>🚀</span> Entrar Imediatamente
      </button>
    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL -->
  <div id="appScreen" class="w-full max-w-6xl h-screen sm:h-[92vh] bg-slate-900 border border-slate-800 sm:rounded-2xl shadow-2xl flex overflow-hidden hidden">
    
    <!-- BARRA LATERAL -->
    <aside class="w-64 sm:w-72 bg-slate-950 border-r border-slate-800 flex flex-col justify-between">
      <div class="p-4 space-y-4">
        <button id="newChatBtn" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl text-sm flex items-center justify-center gap-2 transition">
          <span>+</span> Nova Produção
        </button>

        <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider px-1">
          Projetos Anteriores
        </div>
        <div id="conversationsList" class="space-y-1 overflow-y-auto max-h-[60vh] pr-1"></div>
      </div>

      <div class="p-3 border-t border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2 overflow-hidden">
          <img id="userAvatar" class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700" alt="Avatar" />
          <span id="userName" class="text-xs font-medium text-slate-300 truncate max-w-[120px]">Criador</span>
        </div>
        <button id="logoutBtn" class="text-xs text-rose-400 hover:text-rose-300 transition">Sair</button>
      </div>
    </aside>

    <!-- ÁREA DO CHAT -->
    <main class="flex-1 flex flex-col h-full bg-slate-900">
      <header class="p-3 sm:p-4 border-b border-slate-800 flex justify-between items-center gap-2">
        <div class="flex items-center gap-2">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
          <span id="currentChatTitle" class="text-sm font-semibold text-white truncate max-w-[200px] sm:max-w-xs">Nova Produção</span>
        </div>
        
        <div class="flex items-center gap-2">
          <input 
            type="password" 
            id="geminiKeyInput" 
            placeholder="Gemini API Key" 
            class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-blue-500 w-36 sm:w-48"
          />
          <button id="saveGeminiKeyBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg text-xs transition border border-slate-700">Salvar</button>
        </div>
      </header>

      <div id="chatArea" class="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4">
        <div id="startScreen" class="h-full flex flex-col items-center justify-center text-center space-y-4">
          <h2 class="text-lg font-bold text-white">Pronto para a Etapa 1?</h2>
          <p class="text-sm text-slate-400 max-w-sm">O motor executará estritamente uma etapa por vez. Clique para iniciar.</p>
          <button id="startBtn" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl transition shadow-lg shadow-blue-600/30">
            Iniciar Produção
          </button>
        </div>
      </div>

      <footer class="p-3 sm:p-4 border-t border-slate-800 bg-slate-900/80">
        <form id="chatForm" class="flex gap-2">
          <input 
            type="text" 
            id="userInput" 
            placeholder="Digite [1], [0], [Mais 20] ou sua resposta..." 
            autocomplete="off"
            class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition"
          />
          <button type="submit" id="sendBtn" class="px-5 py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl text-sm transition disabled:opacity-40">
            Enviar
          </button>
        </form>
      </footer>
    </main>

  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
