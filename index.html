<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineReplicate Pro Studio | Desconstrução & Clonagem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-5 mb-8">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-film text-white text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white">CineReplicate <span class="text-indigo-400">Pro Studio</span></h1>
          <p class="text-xs text-slate-400">Extração de personagens mestre, cenários, áudio e prompts T2V</p>
        </div>
      </div>
      <span class="text-xs bg-slate-900 border border-slate-700 text-slate-300 px-3 py-1 rounded-full font-mono">v4.0 FullStack</span>
    </header>

    <!-- Config & Upload -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Gemini API Key</label>
          <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 font-mono">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Idioma (Falas & Áudio)</label>
          <select id="langMode" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
            <option value="detect_to_pt">Detectar Idioma → Português (PT-BR)</option>
            <option value="pt_to_en">Português → Inglês</option>
            <option value="keep_original">Manter Idioma Original</option>
          </select>
        </div>
      </div>

      <div class="md:col-span-2 bg-slate-900 border-2 border-dashed border-slate-800 hover:border-indigo-500/50 transition-colors p-6 rounded-2xl flex flex-col items-center justify-center text-center relative cursor-pointer" id="dropArea">
        <input type="file" id="videoInput" accept="video/mp4,video/webm" class="absolute inset-0 opacity-0 cursor-pointer">
        <i class="fa-solid fa-cloud-arrow-up text-3xl text-indigo-400 mb-2"></i>
        <p class="text-sm font-medium text-slate-200" id="fileLabel">Clique ou arraste o vídeo aqui</p>
        <p class="text-xs text-slate-500 mt-1">MP4 ou WebM</p>
      </div>
    </div>

    <!-- Process Button -->
    <div class="flex justify-end mb-8">
      <button id="processBtn" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition-all text-white font-medium text-sm px-6 py-2.5 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>Desconstruir e Gerar Ativos</span>
      </button>
    </div>

    <!-- Loading -->
    <div id="statusContainer" class="hidden mb-6 p-4 rounded-xl bg-slate-900 border border-slate-800 flex items-center gap-3">
      <div class="animate-spin text-indigo-400 text-lg"><i class="fa-solid fa-circle-notch"></i></div>
      <p id="statusText" class="text-xs font-mono text-slate-300">Aguardando...</p>
    </div>

    <!-- Results Section -->
    <main id="outputContainer" class="space-y-8 hidden">
      <!-- Master Characters Block -->
      <section class="space-y-3">
        <div class="flex items-center gap-2 border-b border-slate-800 pb-2">
          <i class="fa-solid fa-users text-indigo-400"></i>
          <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-300">Personagens Mestre (Consistência)</h2>
        </div>
        <div id="charactersList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>

      <!-- Master Environments Block -->
      <section class="space-y-3">
        <div class="flex items-center gap-2 border-b border-slate-800 pb-2">
          <i class="fa-solid fa-mountain-sun text-indigo-400"></i>
          <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-300">Cenários Mestre (Backgrounds)</h2>
        </div>
        <div id="environmentsList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>

      <!-- Scenes Timeline Block -->
      <section class="space-y-3">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-clapperboard text-indigo-400"></i>
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-300">Cenas Decupadas & Falas</h2>
          </div>
          <button id="copyAllScenesBtn" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 font-mono">
            <i class="fa-regular fa-copy"></i> Copiar Prompts
          </button>
        </div>
        <div id="scenesList" class="space-y-4"></div>
      </section>
    </main>
  </div>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const langMode = document.getElementById('langMode');
    const videoInput = document.getElementById('videoInput');
    const fileLabel = document.getElementById('fileLabel');
    const processBtn = document.getElementById('processBtn');
    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const outputContainer = document.getElementById('outputContainer');
    const charactersList = document.getElementById('charactersList');
    const environmentsList = document.getElementById('environmentsList');
    const scenesList = document.getElementById('scenesList');
    const copyAllScenesBtn = document.getElementById('copyAllScenesBtn');

    let currentFile = null;
    let fullPromptsText = "";

    videoInput.addEventListener('change', (e) => {
      if (e.target.files[0]) {
        currentFile = e.target.files[0];
        fileLabel.innerHTML = `<span class="text-indigo-400 font-semibold">${currentFile.name}</span> (${(currentFile.size / (1024 * 1024)).toFixed(1)} MB)`;
      }
    });

    const fileToBase64 = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });

    processBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) return alert("Insira sua Gemini API Key.");
      if (!currentFile) return alert("Selecione um arquivo de vídeo primeiro.");

      processBtn.disabled = true;
      statusContainer.classList.remove('hidden');
      outputContainer.classList.add('hidden');
      statusText.innerText = "Codificando vídeo...";

      try {
        const base64Data = await fileToBase64(currentFile);
        statusText.innerText = "Desconstruindo vídeo, personagens, áudio e cenários...";

        const langInstructions = {
          "detect_to_pt": "Traduza todas as falas/áudios para Português (PT-BR). Os prompts de imagem/vídeo devem ser em inglês conciso.",
          "pt_to_en": "Traduza todas as falas/áudios para Inglês. Os prompts de imagem/vídeo devem ser em inglês conciso.",
          "keep_original": "Mantenha falas/áudio no idioma original. Prompts de imagem/vídeo em inglês conciso."
        };

        const systemPrompt = `Você é um diretor e engenheiro reverso de vídeo para IA generativa.
Regras de idioma: ${langInstructions[langMode.value]}
Importante: Torne as descrições e prompts de vídeo 50% mais concisos, focando no essencial visual.

Retorne estritamente um JSON no seguinte formato:
{
  "characters": [
    {
      "name": "Nome descritivo",
      "traits": "Aparência física e roupas essenciais",
      "master_prompt": "Prompt em inglês conciso para geração do personagem em gerador de imagem"
    }
  ],
  "environments": [
    {
      "name": "Nome do local",
      "details": "Estilo visual e iluminação",
      "master_prompt": "Prompt em inglês conciso para gerar o cenário sem personagens"
    }
  ],
  "scenes": [
    {
      "scene_number": 1,
      "timestamp": "00:00 - 00:08",
      "camera": "Ângulo e movimento",
      "action": "Ação principal resumida",
      "audio": {
        "speech": "Falas transcritas ou 'Sem falas'",
        "sfx": "Efeitos sonoros principais"
      },
      "prompt_t2v": "Prompt em inglês super conciso e direto para Runway/Kling (máximo 10s)"
    }
  ]
}`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [
              {
                parts: [
                  { text: systemPrompt },
                  { inline_data: { mime_type: currentFile.type || "video/mp4", data: base64Data } }
                ]
              }
            ],
            generationConfig: {
              response_mime_type: "application/json",
              temperature: 0.2
            }
          })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || "Erro na API.");
        }

        const data = await response.json();
        const result = JSON.parse(data.candidates[0].content.parts[0].text);

        renderOutput(result);
        outputContainer.classList.remove('hidden');
      } catch (err) {
        alert("Erro no processamento: " + err.message);
      } finally {
        processBtn.disabled = false;
        statusContainer.classList.add('hidden');
      }
    });

    function renderOutput(data) {
      // 1. Personagens
      charactersList.innerHTML = "";
      (data.characters || []).forEach(char => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-2";
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-indigo-400 uppercase tracking-wide">${char.name}</span>
            <button onclick="navigator.clipboard.writeText('${char.master_prompt.replace(/'/g, "\\'")}')" class="text-slate-400 hover:text-indigo-400 text-xs">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
          <p class="text-xs text-slate-300">${char.traits}</p>
          <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800/80 font-mono text-[11px] text-slate-400 select-all">
            ${char.master_prompt}
          </div>
        `;
        charactersList.appendChild(card);
      });

      // 2. Cenários
      environmentsList.innerHTML = "";
      (data.environments || []).forEach(env => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-2";
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-indigo-400 uppercase tracking-wide">${env.name}</span>
            <button onclick="navigator.clipboard.writeText('${env.master_prompt.replace(/'/g, "\\'")}')" class="text-slate-400 hover:text-indigo-400 text-xs">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
          <p class="text-xs text-slate-300">${env.details}</p>
          <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800/80 font-mono text-[11px] text-slate-400 select-all">
            ${env.master_prompt}
          </div>
        `;
        environmentsList.appendChild(card);
      });

      // 3. Cenas
      fullPromptsText = "";
      scenesList.innerHTML = "";
      (data.scenes || []).forEach(scene => {
        fullPromptsText += `// Cena ${scene.scene_number} (${scene.timestamp})\n${scene.prompt_t2v}\n\n`;

        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3";
        card.innerHTML = `
          <div class="flex items-center justify-between text-xs border-b border-slate-800 pb-2">
            <span class="font-bold text-indigo-400">CENA ${scene.scene_number}</span>
            <div class="flex gap-3 text-slate-400 font-mono text-[11px]">
              <span><i class="fa-regular fa-clock"></i> ${scene.timestamp}</span>
              <span><i class="fa-solid fa-camera"></i> ${scene.camera}</span>
            </div>
          </div>
          <p class="text-xs text-slate-300"><strong>Ação:</strong> ${scene.action}</p>
          <div class="bg-slate-950/60 p-3 rounded-lg border border-slate-800/70 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
            <div>
              <span class="text-indigo-400 font-semibold block mb-0.5"><i class="fa-solid fa-microphone-lines text-[10px]"></i> Fala/Diálogo:</span>
              <p class="text-slate-300 italic">${scene.audio?.speech || 'Sem falas'}</p>
            </div>
            <div>
              <span class="text-indigo-400 font-semibold block mb-0.5"><i class="fa-solid fa-volume-high text-[10px]"></i> SFX/Áudio:</span>
              <p class="text-slate-400">${scene.audio?.sfx || 'Ambiente padrão'}</p>
            </div>
          </div>
          <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 flex items-start justify-between gap-3">
            <div>
              <span class="text-[10px] text-slate-500 uppercase font-semibold block mb-1">Prompt T2V (Direto)</span>
              <p class="text-xs font-mono text-slate-300 select-all">${scene.prompt_t2v}</p>
            </div>
            <button onclick="navigator.clipboard.writeText('${scene.prompt_t2v.replace(/'/g, "\\'")}')" class="text-slate-400 hover:text-indigo-400 text-xs mt-1">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        `;
        scenesList.appendChild(card);
      });
    }

    copyAllScenesBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(fullPromptsText);
      copyAllScenesBtn.innerHTML = `<i class="fa-solid fa-check"></i> Copiado!`;
      setTimeout(() => copyAllScenesBtn.innerHTML = `<i class="fa-regular fa-copy"></i> Copiar Prompts`, 2000);
    });
  </script>
</body>
</html>
