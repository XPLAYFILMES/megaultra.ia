<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Master Studio AI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    .prose table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.85rem; }
    .prose th, .prose td { border: 1px solid #334155; padding: 0.5rem 0.75rem; text-align: left; }
    .prose th { background-color: #1e293b; color: #93c5fd; }
    .prose pre { background-color: #020617; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem; overflow-x: auto; margin: 0.75rem 0; }
    .prose code { color: #38bdf8; font-family: monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4 font-sans" onclick="fecharMenusAbertos(event)">

  <!-- ================= TELA DE CADASTRO / LOGIN ================= -->
  <div id="authScreen" class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-16 h-16 rounded-2xl bg-blue-600/10 border border-blue-500/30 flex items-center justify-center text-blue-400 text-3xl mx-auto shadow-inner">
        🎬
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Universal Master Studio</h1>
      <p class="text-xs text-slate-400">
        Digite seu nome e senha para acessar ou criar sua conta na hora.
      </p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">
          Nome de Usuário
        </label>
        <input 
          type="text" 
          id="authUsername" 
          placeholder="Ex: alex" 
          class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">
          Sua Senha
        </label>
        <input 
          type="password" 
          id="authPassword" 
          placeholder="Digite sua senha" 
          onkeydown="if(event.key==='Enter') executarAcesso()"
          class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition"
        />
      </div>

      <div id="loginFeedback" class="text-xs py-2.5 px-3 rounded-lg hidden font-medium"></div>

      <button 
        type="button" 
        onclick="executarAcesso()"
        class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-blue-600/25 active:scale-[0.98] cursor-pointer">
        Entrar / Cadastrar Conta
      </button>
    </div>
  </div>

  <!-- ================= PAINEL DO STUDIO ================= -->
  <div id="appScreen" class="w-full max-w-6xl h-screen sm:h-[92vh] bg-slate-900 border border-slate-800 sm:rounded-2xl shadow-2xl flex overflow-hidden hidden">
    
    <!-- BARRA LATERAL -->
    <aside class="w-64 sm:w-80 bg-slate-950 border-r border-slate-800 flex flex-col justify-between select-none">
      <div class="p-4 space-y-4 flex-1 flex flex-col min-h-0">
        <button onclick="criarNovoProjeto()" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl text-sm flex items-center justify-center gap-2 transition shadow-md shadow-blue-600/20 shrink-0">
          <span>+</span> Nova Produção
        </button>

        <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider px-1 shrink-0">
          Suas Produções
        </div>
        
        <div id="conversationsList" class="space-y-1.5 overflow-y-auto flex-1 pr-1"></div>
      </div>

      <!-- Rodapé do Usuário -->
      <div class="p-3 border-t border-slate-800 flex items-center justify-between bg-slate-950/60 shrink-0">
        <div class="flex items-center gap-2.5 overflow-hidden">
          <div class="w-8 h-8 rounded-full bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400 font-bold text-xs">
            👤
          </div>
          <div class="flex flex-col truncate">
            <span id="userNameDisplay" class="text-xs font-semibold text-slate-200 truncate">Usuário</span>
            <span class="text-[10px] text-emerald-400 font-medium">Reconhecido</span>
          </div>
        </div>
        <button onclick="fazerLogout()" title="Sair da Conta" class="text-xs text-rose-400 hover:text-rose-300 px-2 py-1 rounded transition">
          Sair
        </button>
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL DO CHAT -->
    <main class="flex-1 flex flex-col h-full bg-slate-900 min-w-0">
      <header class="p-3 sm:p-4 border-b border-slate-800 flex justify-between items-center gap-2 bg-slate-900/80">
        <div class="flex items-center gap-2 truncate">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shrink-0"></div>
          <span id="currentChatTitle" class="text-sm font-semibold text-white truncate max-w-[180px] sm:max-w-md">Nova Produção</span>
        </div>
        
        <!-- Campo para inserir a chave real sem expor no repositório -->
        <div class="flex items-center gap-2 shrink-0">
          <input 
            type="password" 
            id="geminiKeyInput" 
            placeholder="Cole sua chave AIzaSy..." 
            class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-blue-500 w-36 sm:w-56"
          />
          <button onclick="salvarChaveGemini()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg text-xs transition border border-slate-700">
            Salvar
          </button>
        </div>
      </header>

      <div id="chatArea" class="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4">
        <!-- Tela de Início -->
        <div id="startScreen" class="h-full flex flex-col items-center justify-center text-center space-y-4">
          <div class="w-14 h-14 rounded-2xl bg-blue-600/10 border border-blue-500/20 flex items-center justify-center text-blue-400 text-2xl font-bold">
            ⚡
          </div>
          <h2 class="text-lg font-bold text-white">Pronto para a Etapa 1?</h2>
          <p class="text-sm text-slate-400 max-w-sm">
            O motor audiovisual executará estritamente uma etapa por vez sob o sistema monotarefa.
          </p>
          <button onclick="iniciarProducao()" class="px-8 py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition shadow-lg shadow-blue-600/30 transform active:scale-95">
            Iniciar Produção
          </button>
        </div>
      </div>

      <footer class="p-3 sm:p-4 border-t border-slate-800 bg-slate-900/80">
        <div class="flex gap-2">
          <input 
            type="text" 
            id="userInput" 
            placeholder="Digite [1], [0], [Mais 20] ou sua resposta..." 
            onkeydown="if(event.key==='Enter') enviarMensagemUsuario()"
            class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition"
          />
          <button onclick="enviarMensagemUsuario()" id="sendBtn" class="px-5 py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl text-sm transition disabled:opacity-40">
            Enviar
          </button>
        </div>
      </footer>
    </main>

  </div>

  <!-- ================= LÓGICA DO STUDIO ================= -->
  <script>
    const SYSTEM_PROMPT = `[CONFIGURAÇÃO_DE_SISTEMA]
NOME: Universal Master Studio Engine
VERSÃO: 5.5 Ultra-Modular (Cross-Platform Ready: ChatGPT, Copilot, Gemini, Meta AI)
PAPEL: Diretor Geral de Produção Audiovisual, Engenheiro Chefe de Prompts e Arquiteto de Negócios Digitais.

[DIRETRIZES_DE_EXECUÇÃO_OBRIGATÓRIAS - LEIA COM ATENÇÃO]
1. EXECUÇÃO MONOTAREFA ESTRITA: Você opera como uma máquina de estados sequencial. Apresente EXCLUSIVAMENTE a ETAPA ATUAL e PARE IMEDIATAMENTE. É expressamente proibido exibir duas etapas na mesma resposta ou adiantar conteúdos.
2. TRAVA DE VALIDAÇÃO OBRIGATÓRIA (STRICT GATEKEEPING): O avanço para a etapa seguinte é ESTRITAMENTE CONDICIONADO a uma resposta válida do usuário. Se o usuário tentar pular, enviar mensagem vaga, mudar de assunto sem responder ou deixar a pergunta em aberto, NÃO AVANCE sob hipótese alguma. Emita a mensagem padrão: "⚠️ Esta etapa é obrigatória para garantir a consistência do projeto. Por favor, escolha uma das opções acima, digite sua resposta personalizada ou envie [0] para seleção automática." e reapresente a pergunta ativa.
3. PADRONIZAÇÃO DE PERGUNTAS: Nunca altere a estrutura, a ordem ou a linguagem das perguntas básicas. Mantenha o formato fixo para garantir consistência.
4. ISOLAMENTO TOTAL DE NICHOS: Nunca misture assuntos, regras ou terminologias de um nicho em outro. Cada fluxo opera de forma independente e isolada.
5. PADRÃO NUMÉRICO SERIAL: Todas as cenas de imagem e vídeo devem conter obrigatoriamente o prefixo exato "Scene 01:", "Scene 02:", "Scene 03:" até a última cena, sem exceções.
6. COMANDO UNIVERSAL [0] (MODO AUTOMÁTICO): Se o usuário digitar "[0]", "não sei" ou "automático", selecione a melhor opção estratégica de alto engajamento, justifique em 1 linha e avance para a próxima etapa.
7. COMANDO UNIVERSAL [MAIS 20]: Se o usuário digitar "Mais 20", gere imediatamente 20 opções inéditas daquela etapa e mantenha a etapa aberta.
8. COMANDO UNIVERSAL [NOVO]: Se o usuário desejar personalizar, ele pode descrever livremente e você adaptará aos padrões técnicos.

---

[INÍCIO DO FLUXO - MENU PRINCIPAL]
APRESENTE IMEDIATAMENTE AO INICIAR A SEGUINTE ETAPA 1 E AGUARDE A RESPOSTA:

### ETAPA 1: ESCOLHA DO MODO DE OPERAÇÃO
Selecione o que deseja produzir hoje:
- [1] **Produção Audiovisual Completa (Canais Dark / YouTube / Shorts / TikTok)** -> (Inicia o Mapeamento de Vídeo)
- [2] **Fábrica de Novos Prompts (Criador de Mega-Prompts Especializados)** -> (Gera um mega-prompt completo e profissional pronto para outros nichos)

*(Resposta obrigatória: Escolha [1] ou [2] para avançar)*`;

    let memoryUsers = {};
    let memoryProjects = {};

    function getStorageUsers() {
      try {
        const u = localStorage.getItem("studio_final_users");
        return u ? JSON.parse(u) : memoryUsers;
      } catch (e) { return memoryUsers; }
    }

    function saveStorageUsers(users) {
      memoryUsers = users;
      try { localStorage.setItem("studio_final_users", JSON.stringify(users)); } catch (e) {}
    }

    function getStorageProjects(user) {
      const key = "studio_proj_" + user.toLowerCase();
      try {
        const p = localStorage.getItem(key);
        return p ? JSON.parse(p) : (memoryProjects[key] || []);
      } catch (e) { return memoryProjects[key] || []; }
    }

    function saveStorageProjects(user, projs) {
      const key = "studio_proj_" + user.toLowerCase();
      memoryProjects[key] = projs;
      try { localStorage.setItem(key, JSON.stringify(projs)); } catch (e) {}
    }

    let activeUser = null;
    let currentConversationId = null;
    let conversationHistory = [];

    // Salvar e carregar chave Gemini
    try {
      const savedKey = localStorage.getItem("GEMINI_KEY_USER");
      if (savedKey) document.getElementById("geminiKeyInput").value = savedKey;
    } catch (e) {}

    function salvarChaveGemini() {
      const key = document.getElementById("geminiKeyInput").value.trim();
      if (key) {
        try { localStorage.setItem("GEMINI_KEY_USER", key); } catch(e){}
        alert("Chave Gemini salva!");
      }
    }

    // ==========================================
    // AUTENTICAÇÃO
    // ==========================================
    function executarAcesso() {
      const userInput = document.getElementById("authUsername");
      const passInput = document.getElementById("authPassword");
      const feedback = document.getElementById("loginFeedback");

      const username = (userInput.value || "").trim();
      const password = (passInput.value || "").trim();

      if (!username || !password) {
        feedback.textContent = "Preencha o nome de usuário e a senha!";
        feedback.className = "text-xs py-2.5 px-3 rounded-lg font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30";
        feedback.classList.remove("hidden");
        return;
      }

      const users = getStorageUsers();
      const userKey = username.toLowerCase();

      if (users[userKey]) {
        if (users[userKey].password === password) {
          feedback.textContent = `Bem-vindo de volta, ${users[userKey].name}! Entrando...`;
          feedback.className = "text-xs py-2.5 px-3 rounded-lg font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
          feedback.classList.remove("hidden");
          setTimeout(() => abrirStudio(users[userKey].name), 300);
        } else {
          feedback.textContent = "⚠️ Senha incorreta para este usuário!";
          feedback.className = "text-xs py-2.5 px-3 rounded-lg font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30";
          feedback.classList.remove("hidden");
        }
      } else {
        users[userKey] = { name: username, password: password };
        saveStorageUsers(users);

        feedback.textContent = `✨ Conta criada com sucesso! Bem-vindo, ${username}!`;
        feedback.className = "text-xs py-2.5 px-3 rounded-lg font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        feedback.classList.remove("hidden");
        setTimeout(() => abrirStudio(username), 400);
      }
    }

    function abrirStudio(username) {
      activeUser = username;
      try { localStorage.setItem("studio_active_session", username); } catch(e){}

      document.getElementById("authScreen").classList.add("hidden");
      document.getElementById("appScreen").classList.remove("hidden");
      document.getElementById("userNameDisplay").textContent = username;

      atualizarListaProjetos();

      const projs = getStorageProjects(activeUser);
      if (projs.length > 0) {
        selecionarProjeto(projs[0].id);
      } else {
        criarNovoProjeto();
      }
    }

    function fazerLogout() {
      try { localStorage.removeItem("studio_active_session"); } catch(e){}
      activeUser = null;
      window.location.reload();
    }

    // ==========================================
    // MENU DE 3 PONTINHOS (FIXAR, RENOMEAR, EXCLUIR)
    // ==========================================
    function fecharMenusAbertos(e) {
      if (!e.target.closest(".menu-btn") && !e.target.closest(".menu-dropdown")) {
        document.querySelectorAll(".menu-dropdown").forEach(m => m.classList.add("hidden"));
      }
    }

    function toggleMenu(e, id) {
      e.stopPropagation();
      const menu = document.getElementById("dropdown_" + id);
      const estaAberto = !menu.classList.contains("hidden");
      document.querySelectorAll(".menu-dropdown").forEach(m => m.classList.add("hidden"));
      if (!estaAberto) {
        menu.classList.remove("hidden");
      }
    }

    function alternarFixarProjeto(e, id) {
      e.stopPropagation();
      const projs = getStorageProjects(activeUser);
      const proj = projs.find(p => p.id === id);
      if (proj) {
        proj.pinned = !proj.pinned;
        saveStorageProjects(activeUser, projs);
        atualizarListaProjetos();
      }
    }

    function renomearProjeto(e, id) {
      e.stopPropagation();
      const projs = getStorageProjects(activeUser);
      const proj = projs.find(p => p.id === id);
      if (!proj) return;

      const novoNome = prompt("Digite o novo nome para esta produção:", proj.title);
      if (novoNome && novoNome.trim()) {
        proj.title = novoNome.trim();
        saveStorageProjects(activeUser, projs);
        if (currentConversationId === id) {
          document.getElementById("currentChatTitle").textContent = proj.title;
        }
        atualizarListaProjetos();
      }
    }

    function excluirProjeto(e, id) {
      e.stopPropagation();
      const projs = getStorageProjects(activeUser);
      const proj = projs.find(p => p.id === id);
      if (!proj) return;

      if (confirm(`Tem certeza que deseja excluir a produção "${proj.title}"?`)) {
        const filtrados = projs.filter(p => p.id !== id);
        saveStorageProjects(activeUser, filtrados);
        if (currentConversationId === id) {
          if (filtrados.length > 0) {
            selecionarProjeto(filtrados[0].id);
          } else {
            criarNovoProjeto();
          }
        } else {
          atualizarListaProjetos();
        }
      }
    }

    function atualizarListaProjetos() {
      if (!activeUser) return;
      const projs = getStorageProjects(activeUser);
      
      projs.sort((a, b) => {
        if (a.pinned === b.pinned) return 0;
        return a.pinned ? -1 : 1;
      });

      const listEl = document.getElementById("conversationsList");
      listEl.innerHTML = "";

      projs.forEach(p => {
        const wrapper = document.createElement("div");
        wrapper.className = `relative group flex items-center justify-between px-3 py-2 rounded-xl text-xs transition cursor-pointer ${
          p.id === currentConversationId
            ? "bg-slate-800 text-blue-400 font-semibold"
            : "text-slate-400 hover:bg-slate-900/80 hover:text-slate-200"
        } ${p.pinned ? "border-l-2 border-amber-400 bg-slate-900/40" : ""}`;

        wrapper.onclick = () => selecionarProjeto(p.id);

        wrapper.innerHTML = `
          <div class="flex items-center gap-2 truncate pr-2">
            ${p.pinned ? '<span class="text-amber-400 text-[10px]" title="Fixado">📌</span>' : ''}
            <span class="truncate">${p.title || "Nova Produção"}</span>
          </div>

          <button 
            type="button" 
            onclick="toggleMenu(event, '${p.id}')"
            class="menu-btn p-1 rounded-md text-slate-400 hover:text-white hover:bg-slate-700/60 transition opacity-80 group-hover:opacity-100">
            ⋮
          </button>

          <div id="dropdown_${p.id}" class="menu-dropdown absolute right-2 top-8 w-36 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl py-1 z-30 hidden">
            <button onclick="alternarFixarProjeto(event, '${p.id}')" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 text-slate-300 hover:text-amber-300 flex items-center gap-2 text-xs">
              <span>📌</span> ${p.pinned ? "Desafixar" : "Fixar no topo"}
            </button>
            <button onclick="renomearProjeto(event, '${p.id}')" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 text-slate-300 hover:text-blue-300 flex items-center gap-2 text-xs">
              <span>✏️</span> Renomear
            </button>
            <button onclick="excluirProjeto(event, '${p.id}')" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 text-rose-400 hover:text-rose-300 flex items-center gap-2 text-xs border-t border-slate-800">
              <span>🗑️</span> Excluir
            </button>
          </div>
        `;

        listEl.appendChild(wrapper);
      });
    }

    function criarNovoProjeto() {
      if (!activeUser) return;
      const projs = getStorageProjects(activeUser);
      const novo = {
        id: "proj_" + Date.now(),
        title: "Nova Produção",
        pinned: false,
        messages: []
      };
      projs.unshift(novo);
      saveStorageProjects(activeUser, projs);
      atualizarListaProjetos();
      selecionarProjeto(novo.id);
    }

    function selecionarProjeto(id) {
      if (!activeUser) return;
      currentConversationId = id;
      const projs = getStorageProjects(activeUser);
      const proj = projs.find(p => p.id === id);
      if (!proj) return;

      document.getElementById("currentChatTitle").textContent = proj.title;
      const chatArea = document.getElementById("chatArea");
      const startScreen = document.getElementById("startScreen");
      chatArea.innerHTML = "";
      conversationHistory = [];

      if (!proj.messages || proj.messages.length === 0) {
        chatArea.appendChild(startScreen);
        startScreen.classList.remove("hidden");
      } else {
        startScreen.classList.add("hidden");
        proj.messages.forEach(m => {
          conversationHistory.push({ role: m.role, parts: [{ text: m.content }] });
          renderizarMensagem(m.content, m.role === "user");
        });
      }
      atualizarListaProjetos();
    }

    function renderizarMensagem(texto, isUser) {
      const chatArea = document.getElementById("chatArea");
      const div = document.createElement("div");
      div.className = `flex ${isUser ? "justify-end" : "justify-start"} w-full`;
      const bubble = document.createElement("div");
      bubble.className = `max-w-[85%] rounded-2xl p-4 text-sm ${
        isUser
          ? "bg-blue-600 text-white font-medium"
          : "bg-slate-800 border border-slate-700 text-slate-100 prose prose-invert"
      }`;
      bubble.innerHTML = isUser ? texto : (window.marked ? marked.parse(texto) : texto);
      div.appendChild(bubble);
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // ==========================================
    // CHAMADA DIRETA AO GOOGLE GEMINI
    // ==========================================
    async function dispararGemini(texto, isInicial = false) {
      const keyInput = document.getElementById("geminiKeyInput");
      let apiKey = keyInput.value.trim();
      try { if (!apiKey) apiKey = localStorage.getItem("GEMINI_KEY_USER"); } catch(e){}

      if (!apiKey || !apiKey.startsWith("AIzaSy")) {
        alert("Atenção: Você precisa colar uma chave de API do Gemini válida no campo superior direito (ela deve começar com 'AIzaSy') e clicar em Salvar.");
        keyInput.focus();
        return;
      }

      document.getElementById("startScreen").classList.add("hidden");

      const projs = getStorageProjects(activeUser);
      const atual = projs.find(p => p.id === currentConversationId);

      if (!isInicial) {
        renderizarMensagem(texto, true);
        conversationHistory.push({ role: "user", parts: [{ text: texto }] });
        if (atual) {
          atual.messages.push({ role: "user", content: texto });
          saveStorageProjects(activeUser, projs);
        }
      } else {
        conversationHistory.push({
          role: "user",
          parts: [{ text: "Iniciar motor de produção. Apresente a ETAPA 1 do menu principal." }]
        });
      }

      const sendBtn = document.getElementById("sendBtn");
      const userInput = document.getElementById("userInput");
      sendBtn.disabled = true;
      userInput.disabled = true;

      try {
        const resp = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
              contents: conversationHistory,
              generationConfig: { temperature: 0.7, maxOutputTokens: 8192 }
            })
          }
        );

        const data = await resp.json();

        if (data.error) {
          throw new Error(data.error.message || "Erro da API Gemini");
        }

        const resposta = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sem resposta.";

        conversationHistory.push({ role: "model", parts: [{ text: resposta }] });
        renderizarMensagem(resposta, false);

        if (atual) {
          atual.messages.push({ role: "model", content: resposta });
          if (atual.messages.length <= 4 && !isInicial) {
            atual.title = texto.length > 25 ? texto.substring(0, 25) + "..." : texto;
            document.getElementById("currentChatTitle").textContent = atual.title;
          }
          saveStorageProjects(activeUser, projs);
          atualizarListaProjetos();
        }
      } catch (err) {
        renderizarMensagem(`❌ Erro na geração: ${err.message}`, false);
      } finally {
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.focus();
      }
    }

    function iniciarProducao() {
      dispararGemini("", true);
    }

    function enviarMensagemUsuario() {
      const input = document.getElementById("userInput");
      const val = input.value.trim();
      if (!val) return;
      input.value = "";
      dispararGemini(val, false);
    }

    window.onload = function() {
      try {
        const sessao = localStorage.getItem("studio_active_session");
        if (sessao) abrirStudio(sessao);
      } catch (e) {}
    };
  </script>
</body>
</html>
