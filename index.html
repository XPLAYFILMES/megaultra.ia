<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Master Studio AI</title>
  
  <style>
    body {
      background-color: #020617;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .prose table { width: 100%; border-collapse: collapse; margin: 1.25rem 0; font-size: 0.85rem; border-radius: 0.5rem; overflow: hidden; }
    .prose th, .prose td { border: 1px solid #334155; padding: 0.65rem 0.85rem; text-align: left; }
    .prose th { background-color: #1e293b; color: #93c5fd; font-weight: 600; }
    .prose td { background-color: #0f172a; color: #cbd5e1; }
    .prose pre { background-color: #020617; border: 1px solid #334155; border-radius: 0.75rem; padding: 1rem; overflow-x: auto; margin: 1rem 0; }
    .prose code { color: #38bdf8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    
    .prose ul, .prose ol { margin: 1rem 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .prose li { 
      background: rgba(15, 23, 42, 0.7); 
      border: 1px solid rgba(51, 65, 85, 0.7); 
      padding: 0.65rem 0.9rem; 
      border-radius: 0.65rem; 
      line-height: 1.5; 
      color: #e2e8f0;
      transition: all 0.2s ease;
    }
    .prose li:hover {
      border-color: #3b82f6;
      background: rgba(30, 41, 59, 0.85);
    }
    .prose p { margin-bottom: 0.85rem; line-height: 1.6; }
    .prose h3, .prose h4 { color: #60a5fa; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.65rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.4rem; }
    .prose hr { border-color: #334155; margin: 1.5rem 0; }

    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      vertical-align: baseline;
      color: #38bdf8;
      animation: blink 0.8s infinite;
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4 font-sans" onclick="fecharMenusAbertos(event)">

  <!-- PAINEL PRINCIPAL DO STUDIO -->
  <div class="w-full max-w-6xl h-screen sm:h-[92vh] bg-slate-900 border border-slate-800 sm:rounded-2xl shadow-2xl flex overflow-hidden">
    
    <!-- BARRA LATERAL -->
    <aside class="w-64 sm:w-80 bg-slate-950 border-r border-slate-800 flex flex-col justify-between select-none">
      <div class="p-4 space-y-4 flex-1 flex flex-col min-h-0">
        
        <!-- MÓDULOS -->
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Módulos de Produção</label>
            <span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded">3 motores</span>
          </div>
          <div id="sessoesContainer" class="flex flex-col gap-1.5 bg-slate-900/80 p-1.5 rounded-xl border border-slate-800"></div>
        </div>

        <button onclick="criarNovoProjeto()" id="btnNovaAcao" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl text-sm flex items-center justify-center gap-2 transition shadow-md shadow-blue-600/20 shrink-0">
          <span>+</span> Novo Projeto
        </button>

        <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider px-1 shrink-0 flex justify-between items-center">
          <span id="labelHistorico">Projetos Salvos</span>
        </div>
        
        <div id="conversationsList" class="space-y-1.5 overflow-y-auto flex-1 pr-1"></div>
      </div>

      <!-- Rodapé / Chave do Usuário -->
      <div class="p-3 border-t border-slate-800 flex flex-col gap-2 bg-slate-950/60 shrink-0">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-semibold text-slate-400 uppercase">Chave Gemini API</span>
          <span id="keyStatusBadge" class="text-[10px] text-amber-400">⚠️ Ausente</span>
        </div>
        <div class="flex gap-1.5">
          <input 
            type="password" 
            id="geminiKeyInput" 
            placeholder="Cole sua Gemini API Key" 
            oninput="autoSalvarChave()"
            class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500 transition"
          />
          <button onclick="salvarChaveGemini(true)" id="saveKeyBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-2.5 py-1.5 rounded-lg text-xs transition">
            Salvar
          </button>
        </div>
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL DO CHAT -->
    <main class="flex-1 flex flex-col h-full bg-slate-900 min-w-0">
      <header class="p-3 sm:p-4 border-b border-slate-800 flex justify-between items-center gap-2 bg-slate-900/80">
        <div class="flex items-center gap-2 truncate">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shrink-0"></div>
          <span id="currentChatTitle" class="text-sm font-semibold text-white truncate max-w-[200px] sm:max-w-md">Novo Projeto</span>
        </div>
      </header>

      <div id="chatArea" class="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4"></div>

      <footer class="p-3 sm:p-4 border-t border-slate-800 bg-slate-900/80">
        <div class="flex gap-2">
          <input 
            type="text" 
            id="userInput" 
            placeholder="Digite sua resposta ou [0]..." 
            onkeydown="if(event.key==='Enter') enviarMensagemUsuario()"
            class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition"
          />
          <button onclick="enviarMensagemUsuario()" id="sendBtn" class="px-5 py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl text-sm transition disabled:opacity-40">
            Enviar
          </button>
        </div>
      </footer>
    </main>

  </div>

  <script>
    const sessoesDisponiveis = [
      {
        id: "producao",
        nome: "Produção",
        icone: "🎬",
        arquivo: "prompts/producao.txt",
        titulo: "Engine V19.0 Ultra Master",
        descricao: "Diretor de Produção Audiovisual pronto para operar sob o sistema monotarefa."
      },
      {
        id: "storyboard",
        nome: "Storyboard",
        icone: "🎨",
        arquivo: "prompts/storyboard.txt",
        titulo: "Engine de Storyboard Visual",
        descricao: "Decupagem de câmera, quadros-chave sequenciais e painéis visuais."
      },
      {
        id: "gerador",
        nome: "Gerador de Prompts",
        icone: "⚡",
        arquivo: "prompts/gerador.txt",
        titulo: "Fábrica de Prompts Especializados",
        descricao: "Criação de mega-prompts estruturados e comandos avançados de IA."
      }
    ];

    let promptsCache = {};
    let etapasEstaticasCache = {};
    let activeSessionId = "producao";
    let currentConversationId = null;
    let conversationHistory = [];
    let ultimaMensagemPendente = "";
    let isDigitando = false;

    function getStorageProjects(sessao) {
      const key = "studio_clean_projs_" + sessao;
      try {
        const p = localStorage.getItem(key);
        return p ? JSON.parse(p) : [];
      } catch (e) { return []; }
    }

    function saveStorageProjects(sessao, projs) {
      const key = "studio_clean_projs_" + sessao;
      try { localStorage.setItem(key, JSON.stringify(projs)); } catch (e) {}
    }

    function extrairEtapasDoTexto(rawTxt) {
      const etapas = {};
      const regexEtapas = /###\s*(ETAPA\s*[\d\.]+:[^\n]+)([\s\S]*?)(?=###\s*ETAPA|---\s*\[FORMATO|---\s*\[INSTRUÇÃO|$)/gi;
      let match;

      while ((match = regexEtapas.exec(rawTxt)) !== null) {
        const cabecalho = match[1].trim();
        const conteudo = match[2].trim();

        const temOpcoesNumeradas = /\[0\]|\[1\]/.test(conteudo);
        const ehEtapaCriativa = /opções inéditas|gerar 20 novos|títulos magnéticos|enredo mais envolvente/i.test(conteudo);

        const idEtapa = cabecalho.split(":")[0].replace(/\s+/g, "_").toLowerCase();

        etapas[idEtapa] = {
          titulo: `### ${cabecalho}`,
          textoCompleto: `### ${cabecalho}\n\n${conteudo}`,
          estatica: temOpcoesNumeradas && !ehEtapaCriativa
        };
      }

      return etapas;
    }

    async function carregarPromptETratarEtapas(sessaoId) {
      const sessao = sessoesDisponiveis.find(s => s.id === sessaoId) || sessoesDisponiveis[0];

      if (promptsCache[sessao.id]) {
        return promptsCache[sessao.id];
      }

      try {
        const resp = await fetch(sessao.arquivo + "?t=" + Date.now());
        if (resp.ok) {
          const texto = await resp.text();
          promptsCache[sessao.id] = texto;
          etapasEstaticasCache[sessao.id] = extrairEtapasDoTexto(texto);
          return texto;
        }
      } catch (e) {
        console.warn("Erro ao ler o arquivo .txt:", e);
      }

      return "Você é um diretor e engenheiro de IA especializado. Apresente a Etapa 1 e aguarde.";
    }

    function renderizarBotoesSessoes() {
      const container = document.getElementById("sessoesContainer");
      container.innerHTML = "";

      sessoesDisponiveis.forEach(s => {
        const btn = document.createElement("button");
        btn.id = "btn_sessao_" + s.id;
        const isActive = (s.id === activeSessionId);
        btn.className = `w-full py-2 px-3 rounded-lg text-xs font-semibold transition flex items-center justify-between ${
          isActive 
            ? "bg-blue-600 text-white shadow-md shadow-blue-600/30" 
            : "text-slate-400 hover:text-slate-100 hover:bg-slate-800/80"
        }`;
        btn.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-sm">${s.icone}</span> 
            <span>${s.nome}</span>
          </div>
          ${isActive ? '<span class="text-[10px] bg-blue-500/40 px-1.5 py-0.5 rounded text-blue-100">Ativa</span>' : ''}
        `;
        btn.onclick = () => mudarSessao(s.id);
        container.appendChild(btn);
      });
    }

    function mudarSessao(novaSessaoId) {
      if (activeSessionId === novaSessaoId && currentConversationId) return;

      activeSessionId = novaSessaoId;
      currentConversationId = null;
      conversationHistory = [];
      ultimaMensagemPendente = "";

      localStorage.setItem("studio_active_module", novaSessaoId);
      renderizarBotoesSessoes();

      const sessao = sessoesDisponiveis.find(s => s.id === novaSessaoId);
      if (sessao) {
        document.getElementById("btnNovaAcao").innerHTML = `<span>+</span> Novo Projeto (${sessao.nome})`;
        document.getElementById("labelHistorico").textContent = `Projetos de ${sessao.nome}`;
      }

      atualizarListaProjetos();

      const projs = getStorageProjects(activeSessionId);
      if (projs.length > 0) {
        selecionarProjeto(projs[0].id);
      } else {
        criarNovoProjeto();
      }
    }

    function obterChaveUsuario() {
      const input = document.getElementById("geminiKeyInput");
      const val = input ? input.value.trim() : "";
      if (val) return val;
      return localStorage.getItem("studio_gemini_key") || "";
    }

    function autoSalvarChave() {
      const val = document.getElementById("geminiKeyInput").value.trim();
      localStorage.setItem("studio_gemini_key", val);
      atualizarBadgeChave(val);
    }

    function salvarChaveGemini(mostrarAviso = true) {
      const input = document.getElementById("geminiKeyInput");
      const val = input.value.trim();

      if (!val) {
        alert("Cole sua chave de API do Gemini antes de salvar.");
        input.focus();
        return;
      }

      localStorage.setItem("studio_gemini_key", val);
      atualizarBadgeChave(val);

      const btn = document.getElementById("saveKeyBtn");
      btn.textContent = "Salvo ✓";
      btn.className = "bg-emerald-600 text-white font-medium px-2.5 py-1.5 rounded-lg text-xs transition";
      setTimeout(() => {
        btn.textContent = "Salvar";
        btn.className = "bg-blue-600 hover:bg-blue-500 text-white font-medium px-2.5 py-1.5 rounded-lg text-xs transition";
      }, 1500);

      if (mostrarAviso) alert("Chave salva com sucesso!");
    }

    function carregarChave() {
      const key = localStorage.getItem("studio_gemini_key") || "";
      const input = document.getElementById("geminiKeyInput");
      if (input) input.value = key;
      atualizarBadgeChave(key);
    }

    function atualizarBadgeChave(key) {
      const badge = document.getElementById("keyStatusBadge");
      if (!badge) return;
      if (key && key.length > 10) {
        badge.textContent = "✓ Chave Ativa";
        badge.className = "text-[10px] text-emerald-400 font-medium";
      } else {
        badge.textContent = "⚠️ Ausente";
        badge.className = "text-[10px] text-amber-400 font-medium";
      }
    }

    function fecharMenusAbertos(e) {
      if (!e.target.closest(".menu-btn") && !e.target.closest(".menu-dropdown")) {
        document.querySelectorAll(".menu-dropdown").forEach(m => m.classList.add("hidden"));
      }
    }

    function toggleMenu(e, id) {
      e.stopPropagation();
      const menu = document.getElementById("dropdown_" + id);
      const estaAberto = !menu.classList.contains("hidden");
      document.querySelectorAll(".menu-dropdown").forEach(m => m.classList.add("hidden"));
      if (!estaAberto) menu.classList.remove("hidden");
    }

    function alternarFixarProjeto(e, id) {
      e.stopPropagation();
      fecharMenusAbertos({ target: document.body });
      const projs = getStorageProjects(activeSessionId);
      const proj = projs.find(p => p.id === id);
      if (proj) {
        proj.pinned = !proj.pinned;
        saveStorageProjects(activeSessionId, projs);
        atualizarListaProjetos();
      }
    }

    function renomearProjeto(e, id) {
      e.stopPropagation();
      fecharMenusAbertos({ target: document.body });
      const projs = getStorageProjects(activeSessionId);
      const proj = projs.find(p => p.id === id);
      if (!proj) return;

      const novoNome = prompt("Digite o novo nome para este projeto:", proj.title);
      if (novoNome && novoNome.trim()) {
        proj.title = novoNome.trim();
        saveStorageProjects(activeSessionId, projs);
        if (currentConversationId === id) {
          document.getElementById("currentChatTitle").textContent = proj.title;
        }
        atualizarListaProjetos();
      }
    }

    function excluirProjeto(e, id) {
      e.stopPropagation();
      fecharMenusAbertos({ target: document.body });

      const projs = getStorageProjects(activeSessionId);
      const proj = projs.find(p => p.id === id);
      if (!proj) return;

      if (!confirm(`Excluir "${proj.title}"?`)) return;

      const filtrados = projs.filter(p => p.id !== id);
      saveStorageProjects(activeSessionId, filtrados);

      if (currentConversationId === id) {
        if (filtrados.length > 0) {
          selecionarProjeto(filtrados[0].id);
        } else {
          criarNovoProjeto();
        }
      } else {
        atualizarListaProjetos();
      }
    }

    function atualizarListaProjetos() {
      const projs = getStorageProjects(activeSessionId);
      
      projs.sort((a, b) => {
        if (Boolean(a.pinned) === Boolean(b.pinned)) return 0;
        return a.pinned ? -1 : 1;
      });

      const listEl = document.getElementById("conversationsList");
      listEl.innerHTML = "";

      projs.forEach(p => {
        const wrapper = document.createElement("div");
        wrapper.className = `relative group flex items-center justify-between px-3 py-2 rounded-xl text-xs transition cursor-pointer ${
          p.id === currentConversationId
            ? "bg-slate-800 text-blue-400 font-semibold"
            : "text-slate-400 hover:bg-slate-900/80 hover:text-slate-200"
        } ${p.pinned ? "border-l-2 border-amber-400 bg-slate-900/40" : ""}`;

        wrapper.onclick = () => selecionarProjeto(p.id);

        wrapper.innerHTML = `
          <div class="flex items-center gap-2 truncate pr-2">
            ${p.pinned ? '<span class="text-amber-400 text-[10px]" title="Fixado">📌</span>' : ''}
            <span class="truncate">${p.title || "Novo Projeto"}</span>
          </div>

          <button 
            type="button" 
            onclick="toggleMenu(event, '${p.id}')"
            class="menu-btn p-1 rounded-md text-slate-400 hover:text-white hover:bg-slate-700/60 transition opacity-80 group-hover:opacity-100">
            ⋮
          </button>

          <div id="dropdown_${p.id}" class="menu-dropdown absolute right-2 top-8 w-36 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl py-1 z-30 hidden">
            <button onclick="alternarFixarProjeto(event, '${p.id}')" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 text-slate-300 hover:text-amber-300 flex items-center gap-2 text-xs">
              <span>📌</span> ${p.pinned ? "Desafixar" : "Fixar no topo"}
            </button>
            <button onclick="renomearProjeto(event, '${p.id}')" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 text-slate-300 hover:text-blue-300 flex items-center gap-2 text-xs">
              <span>✏️</span> Renomear
            </button>
            <button onclick="excluirProjeto(event, '${p.id}')" class="w-full text-left px-3 py-1.5 hover:bg-slate-800 text-rose-400 hover:text-rose-300 flex items-center gap-2 text-xs border-t border-slate-800">
              <span>🗑️</span> Excluir
            </button>
          </div>
        `;

        listEl.appendChild(wrapper);
      });
    }

    function exibirPainelInicialCentral() {
      const chatArea = document.getElementById("chatArea");
      chatArea.innerHTML = "";

      const sessao = sessoesDisponiveis.find(s => s.id === activeSessionId) || sessoesDisponiveis[0];

      const startDiv = document.createElement("div");
      startDiv.className = "h-full flex flex-col items-center justify-center text-center space-y-4 py-12";
      startDiv.innerHTML = `
        <div class="w-16 h-16 rounded-2xl bg-blue-600/10 border border-blue-500/20 flex items-center justify-center text-blue-400 text-3xl font-bold shadow-inner">
          ${sessao.icone}
        </div>
        <h2 class="text-xl font-bold text-white tracking-tight">${sessao.titulo}</h2>
        <p class="text-sm text-slate-400 max-w-sm">
          ${sessao.descricao}
        </p>
        <button onclick="iniciarProducao()" class="px-8 py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition shadow-lg shadow-blue-600/30 transform active:scale-95 cursor-pointer">
          Iniciar ${sessao.nome}
        </button>
      `;
      chatArea.appendChild(startDiv);
    }

    function criarNovoProjeto() {
      const projs = getStorageProjects(activeSessionId);
      const sessao = sessoesDisponiveis.find(s => s.id === activeSessionId);
      const novo = {
        id: "proj_" + Date.now(),
        title: sessao ? `Novo ${sessao.nome}` : "Novo Projeto",
        pinned: false,
        messages: []
      };
      projs.unshift(novo);
      saveStorageProjects(activeSessionId, projs);
      atualizarListaProjetos();
      selecionarProjeto(novo.id);
    }

    function selecionarProjeto(id) {
      currentConversationId = id;

      const projs = getStorageProjects(activeSessionId);
      const proj = projs.find(p => p.id === id);
      if (!proj) return;

      document.getElementById("currentChatTitle").textContent = proj.title;
      const chatArea = document.getElementById("chatArea");
      chatArea.innerHTML = "";
      conversationHistory = [];

      if (!proj.messages || proj.messages.length === 0) {
        exibirPainelInicialCentral();
      } else {
        proj.messages.forEach(m => {
          conversationHistory.push({ role: m.role, parts: [{ text: m.content }] });
          renderizarMensagemInstantanea(m.content, m.role === "user");
        });
      }
      atualizarListaProjetos();
    }

    function formatarTextoComOpcoes(rawText) {
      let formatado = rawText;
      formatado = formatado.replace(/(\n|^)(\[\d+\][^\n]+)/g, '$1- $2');
      return marked.parse(formatado);
    }

    function renderizarMensagemInstantanea(texto, isUser, isError = false) {
      const chatArea = document.getElementById("chatArea");
      const div = document.createElement("div");
      div.className = `flex ${isUser ? "justify-end" : "justify-start"} w-full`;
      const bubble = document.createElement("div");

      if (isError) {
        bubble.className = "max-w-[85%] rounded-2xl p-4 text-sm bg-rose-500/10 border border-rose-500/30 text-rose-200 space-y-3";
        bubble.innerHTML = `
          <div class="leading-relaxed">${texto}</div>
          <button onclick="tentarNovamente()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold flex items-center gap-2 transition shadow-md shadow-emerald-600/30 cursor-pointer">
            <span>▶</span> Continuar de Onde Parou
          </button>
        `;
      } else {
        bubble.className = `max-w-[92%] sm:max-w-[85%] rounded-2xl p-4 text-sm ${
          isUser
            ? "bg-blue-600 text-white font-medium shadow-md"
            : "bg-slate-900 border border-slate-700/80 text-slate-100 prose prose-invert shadow-md relative"
        }`;
        bubble.innerHTML = isUser ? texto : formatarTextoComOpcoes(texto);
      }

      div.appendChild(bubble);
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    async function renderizarMensagemDigitando(textoCompleto) {
      isDigitando = true;
      const chatArea = document.getElementById("chatArea");
      const div = document.createElement("div");
      div.className = "flex justify-start w-full";
      
      const bubble = document.createElement("div");
      bubble.className = "max-w-[92%] sm:max-w-[85%] rounded-2xl p-4 text-sm bg-slate-900 border border-slate-700/80 text-slate-100 prose prose-invert shadow-md relative typing-cursor";
      bubble.innerHTML = "<span></span>";
      div.appendChild(bubble);
      chatArea.appendChild(div);

      const spanConteudo = bubble.querySelector("span");

      let index = 0;
      const tamanhoTotal = textoCompleto.length;
      const passo = tamanhoTotal > 800 ? 6 : (tamanhoTotal > 300 ? 4 : 2);
      const velocidadeMs = 10;

      return new Promise((resolve) => {
        const timer = setInterval(() => {
          index += passo;
          if (index >= tamanhoTotal) {
            index = tamanhoTotal;
            clearInterval(timer);
            bubble.classList.remove("typing-cursor");
            bubble.innerHTML = formatarTextoComOpcoes(textoCompleto);
            chatArea.scrollTop = chatArea.scrollHeight;
            isDigitando = false;
            resolve();
          } else {
            const textoParcial = textoCompleto.substring(0, index);
            spanConteudo.innerHTML = formatarTextoComOpcoes(textoParcial);
            chatArea.scrollTop = chatArea.scrollHeight;
          }
        }, velocidadeMs);
      });
    }

    function detectarEAtualizarTitulo(textoUsuario, respostaModelo, projetoAtual, todosProjetos) {
      const matchTitulo = respostaModelo.match(/(?:TÍTULO ESCOLHIDO|Título Oficial|Título do Vídeo|Título do Storyboard|Projeto):\s*["']?([^"'\n]+)["']?/i);
      if (matchTitulo && matchTitulo[1]) {
        const tituloLimpo = matchTitulo[1].replace(/[*#]/g, '').trim();
        projetoAtual.title = tituloLimpo;
        document.getElementById("currentChatTitle").textContent = tituloLimpo;
        saveStorageProjects(activeSessionId, todosProjetos);
        atualizarListaProjetos();
        return;
      }

      if (textoUsuario && !textoUsuario.startsWith("[") && isNaN(textoUsuario.trim()) && textoUsuario.length >= 3) {
        const tituloResumo = textoUsuario.length > 25 ? textoUsuario.substring(0, 25) + "..." : textoUsuario;
        projetoAtual.title = tituloResumo;
        document.getElementById("currentChatTitle").textContent = tituloResumo;
        saveStorageProjects(activeSessionId, todosProjetos);
        atualizarListaProjetos();
      }
    }

    async function dispararFluxo(texto, isInicial = false, isRetomada = false) {
      if (isDigitando) return;

      const projs = getStorageProjects(activeSessionId);
      const atual = projs.find(p => p.id === currentConversationId);

      if (isInicial && (!atual.messages || atual.messages.length === 0)) {
        document.getElementById("chatArea").innerHTML = "";
      }

      const promptMestre = await carregarPromptETratarEtapas(activeSessionId);
      const mapaEtapas = etapasEstaticasCache[activeSessionId] || {};

      // 1. INICIAL: Exibe a Etapa 1 do arquivo .txt sem gastar API
      if (isInicial) {
        const primeiraEtapaId = Object.keys(mapaEtapas)[0];
        if (primeiraEtapaId && mapaEtapas[primeiraEtapaId].textoCompleto) {
          const textoEtapa1 = mapaEtapas[primeiraEtapaId].textoCompleto;
          conversationHistory.push({ role: "model", parts: [{ text: textoEtapa1 }] });
          renderizarMensagemInstantanea(textoEtapa1, false);

          if (atual) {
            atual.messages.push({ role: "model", content: textoEtapa1 });
            saveStorageProjects(activeSessionId, projs);
          }
          return;
        }
      }

      // Registra a mensagem do usuário
      if (!isInicial && !isRetomada) {
        renderizarMensagemInstantanea(texto, true);
        conversationHistory.push({ role: "user", parts: [{ text: texto }] });
        if (atual) {
          atual.messages.push({ role: "user", content: texto });
          saveStorageProjects(activeSessionId, projs);
        }
      }

      // 2. SE FOR ETAPA ESTÁTICA COM OPÇÕES FIXAS DO TXT (Zero API)
      const mensagensModelo = conversationHistory.filter(m => m.role === "model");
      const indiceProximaEtapa = mensagensModelo.length;
      const chavesEtapas = Object.keys(mapaEtapas);

      if (chavesEtapas[indiceProximaEtapa] && mapaEtapas[chavesEtapas[indiceProximaEtapa]].estatica) {
        const textoProximaEtapa = mapaEtapas[chavesEtapas[indiceProximaEtapa]].textoCompleto;
        conversationHistory.push({ role: "model", parts: [{ text: textoProximaEtapa }] });
        renderizarMensagemInstantanea(textoProximaEtapa, false);

        if (atual) {
          atual.messages.push({ role: "model", content: textoProximaEtapa });
          saveStorageProjects(activeSessionId, projs);
        }
        return;
      }

      // 3. SE A ETAPA EXIGIR CRIAÇÃO: ACIONA O GEMINI
      const apiKey = obterChaveUsuario();
      if (!apiKey || apiKey.length < 10) {
        alert("Cole sua chave gratuita da Gemini API no rodapé esquerdo para continuar.");
        document.getElementById("geminiKeyInput").focus();
        return;
      }

      const sendBtn = document.getElementById("sendBtn");
      const userInput = document.getElementById("userInput");
      sendBtn.disabled = true;
      userInput.disabled = true;

      const indicador = document.createElement("div");
      indicador.id = "indicadorCarregando";
      indicador.className = "flex justify-start w-full";
      indicador.innerHTML = `
        <div class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-400 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-blue-500 animate-ping"></span>
          Processando etapa criativa...
        </div>
      `;
      document.getElementById("chatArea").appendChild(indicador);
      document.getElementById("chatArea").scrollTop = document.getElementById("chatArea").scrollHeight;

      const modelosCandidatos = [
        "gemini-2.5-flash",
        "gemini-2.0-flash",
        "gemini-1.5-flash"
      ];

      let respostaFinal = null;
      for (const modelo of modelosCandidatos) {
        try {
          const resp = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${apiKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: promptMestre }] },
                contents: conversationHistory,
                generationConfig: { 
                  temperature: 0.8, 
                  topP: 0.95,
                  maxOutputTokens: 8192 
                }
              })
            }
          );

          const data = await resp.json();
          if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
            respostaFinal = data.candidates[0].content.parts[0].text;
            break;
          }
        } catch (err) {}
      }

      const loadEl = document.getElementById("indicadorCarregando");
      if (loadEl) loadEl.remove();

      if (respostaFinal) {
        conversationHistory.push({ role: "model", parts: [{ text: respostaFinal }] });
        await renderizarMensagemDigitando(respostaFinal);

        if (atual) {
          atual.messages.push({ role: "model", content: respostaFinal });
          detectarEAtualizarTitulo(texto, respostaFinal, atual, projs);
          saveStorageProjects(activeSessionId, projs);
        }
        ultimaMensagemPendente = "";
      } else {
        renderizarMensagemInstantanea(
          `⚠️ **Houve uma oscilação na conexão com a IA.**\n\nSua última escolha foi salva. Clique abaixo para tentar novamente:`,
          false,
          true
        );
      }

      sendBtn.disabled = false;
      userInput.disabled = false;
      userInput.focus();
    }

    function tentarNovamente() {
      const chatArea = document.getElementById("chatArea");
      const erroBox = chatArea.lastElementChild;
      if (erroBox) erroBox.remove();

      if (ultimaMensagemPendente) {
        dispararFluxo(ultimaMensagemPendente, false, true);
      } else {
        dispararFluxo("", true, true);
      }
    }

    function iniciarProducao() {
      dispararFluxo("", true);
    }

    function enviarMensagemUsuario() {
      if (isDigitando) return;
      const input = document.getElementById("userInput");
      const val = input.value.trim();
      if (!val) return;
      input.value = "";
      dispararFluxo(val, false, false);
    }

    window.addEventListener("DOMContentLoaded", () => {
      carregarChave();

      const moduloSalvo = localStorage.getItem("studio_active_module");
      if (moduloSalvo && sessoesDisponiveis.some(s => s.id === moduloSalvo)) {
        activeSessionId = moduloSalvo;
      }

      renderizarBotoesSessoes();
      atualizarListaProjetos();

      const projs = getStorageProjects(activeSessionId);
      if (projs.length > 0) {
        selecionarProjeto(projs[0].id);
      } else {
        criarNovoProjeto();
      }
    });
  </script>
</body>
