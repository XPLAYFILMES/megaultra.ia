<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente Assistente</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-center justify-center min-h-screen p-4">

  <main class="w-full max-w-xl bg-slate-900 rounded-2xl shadow-xl border border-slate-800 flex flex-col h-[85vh]">
    <!-- Topo -->
    <header class="p-4 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        <h1 class="font-semibold text-slate-100 text-sm">Assistente Online</h1>
      </div>
      <span class="text-xs text-slate-400 bg-slate-800 px-2.5 py-1 rounded-full">Acesso Liberado</span>
    </header>

    <!-- Chat -->
    <div id="chatHistory" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm">
      <div class="bg-slate-800 text-slate-300 p-3 rounded-xl max-w-[85%] border border-slate-700">
        Olá! Sou seu assistente de inteligência artificial. Como posso te ajudar hoje?
      </div>
    </div>

    <!-- Campo de Entrada -->
    <footer class="p-3 border-t border-slate-800 flex gap-2">
      <input type="text" id="userInput" placeholder="Envie sua mensagem..." 
        class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"
        onkeypress="if(event.key==='Enter') enviarMensagem()">
      
      <button onclick="enviarMensagem()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition">
        Enviar
      </button>
    </footer>
  </main>

  <script>
    async function enviarMensagem() {
      const input = document.getElementById("userInput");
      const chat = document.getElementById("chatHistory");
      const texto = input.value.trim();

      if (!texto) return;

      // Renderiza mensagem do usuário
      chat.innerHTML += `
        <div class="flex justify-end">
          <div class="bg-emerald-600 text-white p-3 rounded-xl rounded-tr-none max-w-[85%]">
            ${texto}
          </div>
        </div>
      `;
      input.value = "";
      chat.scrollTop = chat.scrollHeight;

      // Mensagem temporária de "digitando..."
      const tempId = "temp-" + Date.now();
      chat.innerHTML += `
        <div id="${tempId}" class="flex justify-start">
          <div class="bg-slate-800 text-slate-400 p-3 rounded-xl rounded-tl-none border border-slate-700">
            Digitando...
          </div>
        </div>
      `;
      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensagem: texto })
        });

        const data = await response.json();
        const tempElem = document.getElementById(tempId);

        if (data.resposta) {
          tempElem.outerHTML = `
            <div class="flex justify-start">
              <div class="bg-slate-800 text-slate-100 p-3 rounded-xl rounded-tl-none border border-slate-700 max-w-[85%] whitespace-pre-wrap">
                ${data.resposta}
              </div>
            </div>
          `;
        } else {
          tempElem.outerHTML = `
            <div class="flex justify-start">
              <div class="bg-red-950/60 text-red-300 p-3 rounded-xl rounded-tl-none border border-red-800 text-xs">
                ${data.erro || "Ocorreu um erro ao responder."}
              </div>
            </div>
          `;
        }
      } catch (err) {
        document.getElementById(tempId).innerText = "Erro ao conectar ao servidor.";
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
