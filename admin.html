<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo | Central Monetização</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#05070B] text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Topo Admin -->
    <header class="flex items-center justify-between bg-slate-900/60 border border-slate-800 p-5 rounded-2xl">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center font-black text-black text-lg shadow-lg shadow-amber-500/20">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-white uppercase tracking-wide">Painel de Gestão de Clientes</h1>
          <p class="text-xs text-slate-400">Controle de acessos, tokens e renovações de 30 dias</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-3 py-1 rounded-full font-mono">
          <i class="fa-solid fa-circle text-[8px] mr-1"></i> Admin Conectado
        </span>
      </div>
    </header>

    <!-- Cadastro de Novo Usuário -->
    <section class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-user-plus text-indigo-400"></i> Cadastrar Novo Cliente (Acesso de 30 Dias)
      </h2>
      <form id="createUserForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Nome do Cliente</label>
          <input type="text" id="clientName" placeholder="Ex: João da Silva" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">WhatsApp / Contato</label>
          <input type="text" id="clientContact" placeholder="Ex: (11) 99999-9999" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div class="flex items-end">
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-medium text-xs py-2 px-4 rounded-lg transition flex items-center justify-center gap-2 cursor-pointer shadow-lg shadow-indigo-600/30">
            <i class="fa-solid fa-link"></i> Gerar Link Exclusivo (30 Dias)
          </button>
        </div>
      </form>
    </section>

    <!-- Tabela de Clientes Cadastrados -->
    <section class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-users text-indigo-400"></i> Clientes Cadastrados
        </h2>
        <span id="totalClientsCount" class="text-xs font-mono text-slate-400">0 Clientes</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="text-[11px] uppercase tracking-wider bg-slate-950/70 text-slate-400 border-b border-slate-800">
            <tr>
              <th class="p-3">Cliente</th>
              <th class="p-3">Status</th>
              <th class="p-3">Data Cadastro</th>
              <th class="p-3">Data Vencimento</th>
              <th class="p-3">Link de Acesso</th>
              <th class="p-3 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="clientsTableBody" class="divide-y divide-slate-800/60 font-mono">
            <!-- Linhas renderizadas via JS -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    const STORAGE_KEY = 'cm_client_database';

    function getClients() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function saveClients(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      renderClients();
    }

    function generateToken() {
      return 'cm_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
    }

    function formatDate(isoStr) {
      const d = new Date(isoStr);
      return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function renderClients() {
      const clients = getClients();
      const tbody = document.getElementById('clientsTableBody');
      const counter = document.getElementById('totalClientsCount');
      counter.textContent = `${clients.length} ${clients.length === 1 ? 'Cliente' : 'Clientes'}`;
      tbody.innerHTML = '';

      if (clients.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500 font-sans">Nenhum cliente cadastrado ainda.</td></tr>`;
        return;
      }

      const now = new Date().getTime();
      const baseUrl = window.location.origin + window.location.pathname.replace('admin.html', 'index.html');

      clients.forEach(c => {
        const expiresAtMs = new Date(c.expiresAt).getTime();
        const isExpired = now > expiresAtMs || c.status === 'inativo';
        const userLink = `${baseUrl}?token=${c.token}`;

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-950/40 transition";
        tr.innerHTML = `
          <td class="p-3 font-sans font-medium text-white">
            ${c.name}
            ${c.contact ? `<br><span class="text-[10px] text-slate-500">${c.contact}</span>` : ''}
          </td>
          <td class="p-3">
            <span class="px-2 py-0.5 rounded text-[10px] uppercase font-bold ${isExpired ? 'bg-rose-950 text-rose-400 border border-rose-800' : 'bg-emerald-950 text-emerald-400 border border-emerald-800'}">
              ${isExpired ? 'Expirado' : 'Ativo'}
            </span>
          </td>
          <td class="p-3 text-[11px] text-slate-400">${formatDate(c.createdAt)}</td>
          <td class="p-3 text-[11px] ${isExpired ? 'text-rose-400 font-bold' : 'text-slate-300'}">${formatDate(c.expiresAt)}</td>
          <td class="p-3">
            <div class="flex items-center gap-1.5 bg-slate-950 border border-slate-800 px-2 py-1 rounded max-w-xs">
              <span class="truncate text-[10px] text-indigo-300 select-all">${userLink}</span>
              <button onclick="copyToClipboard('${userLink}')" title="Copiar Link" class="text-slate-400 hover:text-white text-xs cursor-pointer">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </td>
          <td class="p-3 text-right space-x-2 font-sans">
            <button onclick="renewClient('${c.id}')" title="Renovar por mais 30 dias mantendo o mesmo link" class="bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded text-xs transition cursor-pointer">
              <i class="fa-solid fa-arrows-rotate mr-1"></i> Renovar +30d
            </button>
            <button onclick="deleteClient('${c.id}')" title="Excluir" class="text-slate-500 hover:text-rose-400 text-xs transition cursor-pointer">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('createUserForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('clientName').value.trim();
      const contact = document.getElementById('clientContact').value.trim();

      const createdAt = new Date();
      // Calcula exatamente 30 dias a partir do momento atual
      const expiresAt = new Date(createdAt.getTime() + (30 * 24 * 60 * 60 * 1000));

      const newClient = {
        id: 'client_' + Date.now(),
        name,
        contact,
        token: generateToken(),
        createdAt: createdAt.toISOString(),
        expiresAt: expiresAt.toISOString(),
        status: 'ativo'
      };

      const clients = getClients();
      clients.unshift(newClient);
      saveClients(clients);

      document.getElementById('clientName').value = '';
      document.getElementById('clientContact').value = '';

      alert(`Cliente cadastrado com sucesso!\nLink gerado e pronto para envio.`);
    });

    window.renewClient = function(id) {
      const clients = getClients();
      const index = clients.findIndex(c => c.id === id);
      if (index === -1) return;

      const client = clients[index];
      const now = new Date().getTime();
      const currentExpiry = new Date(client.expiresAt).getTime();

      // Se já venceu, adiciona 30 dias a partir de agora; se ainda não venceu, soma 30 dias ao prazo existente
      const baseDate = currentExpiry > now ? currentExpiry : now;
      client.expiresAt = new Date(baseDate + (30 * 24 * 60 * 60 * 1000)).toISOString();
      client.status = 'ativo';

      saveClients(clients);
      alert(`Acesso de ${client.name} renovado por mais 30 dias!\nO link de acesso continua o mesmo.`);
    };

    window.deleteClient = function(id) {
      if (!confirm("Deseja realmente remover este cliente? O link dele deixará de funcionar imediatamente.")) return;
      let clients = getClients();
      clients = clients.filter(c => c.id !== id);
      saveClients(clients);
    };

    window.copyToClipboard = function(text) {
      navigator.clipboard.writeText(text);
      alert("Link do cliente copiado!");
    };

    renderClients();
  </script>
</body>
</html>
