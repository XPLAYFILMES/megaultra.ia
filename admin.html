<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Master | CineMorph AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#05070B] text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">

    <header class="flex items-center justify-between bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-black text-white text-lg shadow-lg shadow-indigo-600/30">
          CM
        </div>
        <div>
          <h1 class="text-sm font-bold text-white uppercase tracking-wider">CineMorph AI — Gestão de Licenças</h1>
          <p class="text-xs text-slate-400">Controle de links de acesso e renovações (30 Dias)</p>
        </div>
      </div>
      <span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-3 py-1 rounded-full font-mono">
        <i class="fa-solid fa-circle text-[8px] mr-1"></i> Admin Master Conectado
      </span>
    </header>

    <!-- Cadastro -->
    <section class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-user-plus text-indigo-400"></i> Cadastrar Novo Cliente (Acesso por 30 Dias)
      </h2>
      <form id="clientForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Nome do Cliente</label>
          <input type="text" id="clientName" placeholder="Ex: Lucas Souza" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Contato / WhatsApp</label>
          <input type="text" id="clientContact" placeholder="(00) 00000-0000" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div class="flex items-end">
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs py-2 px-4 rounded-lg transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 cursor-pointer">
            <i class="fa-solid fa-link"></i> Gerar Link Exclusivo (30d)
          </button>
        </div>
      </form>
    </section>

    <!-- Lista de Clientes -->
    <section class="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-users text-indigo-400"></i> Licenças Emitidas
        </h2>
        <span id="clientCounter" class="text-xs font-mono text-slate-400">0 Cadastros</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="text-[11px] uppercase tracking-wider bg-slate-950/80 text-slate-400 border-b border-slate-800 font-mono">
            <tr>
              <th class="p-3">Cliente</th>
              <th class="p-3">Status</th>
              <th class="p-3">Cadastro</th>
              <th class="p-3">Vencimento</th>
              <th class="p-3">Link de Acesso Único</th>
              <th class="p-3 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="clientsTable" class="divide-y divide-slate-800/60 font-mono"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const STORAGE = 'cm_admin_clients';

    function getList() {
      return JSON.parse(localStorage.getItem(STORAGE) || '[]');
    }

    function saveList(list) {
      localStorage.setItem(STORAGE, JSON.stringify(list));
      render();
    }

    function createSignedToken(nome, expDateMs) {
      const payload = { nome, exp: expDateMs, rand: Math.random().toString(36).slice(2, 7) };
      return 'cm_' + btoa(JSON.stringify(payload));
    }

    function formatDate(ms) {
      const d = new Date(ms);
      return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function render() {
      const list = getList();
      const tbody = document.getElementById('clientsTable');
      document.getElementById('clientCounter').innerText = `${list.length} Licenças`;
      tbody.innerHTML = '';

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500 font-sans">Nenhum cliente cadastrado.</td></tr>`;
        return;
      }

      const now = Date.now();
      const origin = window.location.origin;

      list.forEach(c => {
        const isExpired = now > c.exp;
        const link = `${origin}/index.html?token=${c.token}`;

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-950/40 transition";
        tr.innerHTML = `
          <td class="p-3 font-sans font-medium text-white">
            ${c.name}
            ${c.contact ? `<br><span class="text-[10px] text-slate-500">${c.contact}</span>` : ''}
          </td>
          <td class="p-3">
            <span class="px-2 py-0.5 rounded text-[10px] uppercase font-bold ${isExpired ? 'bg-rose-950 text-rose-400 border border-rose-800' : 'bg-emerald-950 text-emerald-400 border border-emerald-800'}">
              ${isExpired ? 'Expirado' : 'Ativo'}
            </span>
          </td>
          <td class="p-3 text-[11px] text-slate-400">${formatDate(c.created)}</td>
          <td class="p-3 text-[11px] ${isExpired ? 'text-rose-400 font-bold' : 'text-slate-300'}">${formatDate(c.exp)}</td>
          <td class="p-3">
            <div class="flex items-center gap-1.5 bg-slate-950 border border-slate-800 px-2 py-1 rounded max-w-xs">
              <span class="truncate text-[10px] text-indigo-300 select-all">${link}</span>
              <button onclick="navigator.clipboard.writeText('${link}'); alert('Link copiado!');" title="Copiar Link" class="text-slate-400 hover:text-white text-xs cursor-pointer">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </td>
          <td class="p-3 text-right space-x-2 font-sans">
            <button onclick="renew('${c.id}')" class="bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded text-xs transition cursor-pointer">
              <i class="fa-solid fa-arrows-rotate mr-1"></i> +30d
            </button>
            <button onclick="removeClient('${c.id}')" class="text-slate-500 hover:text-rose-400 text-xs transition cursor-pointer">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('clientForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('clientName').value.trim();
      const contact = document.getElementById('clientContact').value.trim();

      const created = Date.now();
      const exp = created + (30 * 24 * 60 * 60 * 1000);
      const token = createSignedToken(name, exp);

      const client = { id: 'c_' + Date.now(), name, contact, created, exp, token };
      const list = getList();
      list.unshift(client);
      saveList(list);

      document.getElementById('clientName').value = '';
      document.getElementById('clientContact').value = '';
      alert("Link exclusivo gerado com sucesso!");
    });

    window.renew = function(id) {
      const list = getList();
      const c = list.find(x => x.id === id);
      if (!c) return;

      const base = c.exp > Date.now() ? c.exp : Date.now();
      c.exp = base + (30 * 24 * 60 * 60 * 1000);
      c.token = createSignedToken(c.name, c.exp);
      saveList(list);
      alert(`Acesso renovado por +30 dias para ${c.name}!`);
    };

    window.removeClient = function(id) {
      if (!confirm("Deseja revogar o acesso deste cliente?")) return;
      saveList(getList().filter(x => x.id !== id));
    };

    render();
  </script>
</body>
</html>
